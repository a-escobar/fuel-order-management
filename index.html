const { useState, useEffect, useMemo, useCallback } = React;

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const STATIONS    = ['Puma Juticalpa','Limones','Las Delicias','La Granja','Puma Paz'];
// Supply-only: we don't manage their tanks; they tell us how much they need
const SUPPLY_ONLY = new Set(['Limones', 'Puma Paz']);
const isSupplyOnly = s => SUPPLY_ONLY.has(s);
const FUELS       = ['Regular','Super','Diesel'];
const DAYS_ES     = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// Juticalpa underground sets and which fuels each carries
const JUTA_SETS = { 'Set 1': ['Regular','Super','Diesel'], 'Set 2': ['Super','Diesel'] };

const FUEL_ICONS  = { Regular:'⛽', Super:'⚡', Diesel:'🔧' };
// Regular=Yellow, Super=Red, Diesel=Green — uniform throughout the app
const FUEL_COLORS = { Regular:'#ca8a04', Super:'#dc2626', Diesel:'#059669' };
const FUEL_LIGHT  = { Regular:'#fef9c3', Super:'#fee2e2', Diesel:'#d1fae5' };
const SET_COLORS  = { 'Set 1':'#1e3a5f', 'Set 2':'#7c3aed' };
const STATION_COLORS = {
  'Puma Juticalpa':'#1e3a5f','Limones':'#7c3aed',
  'Las Delicias':'#db2777','La Granja':'#d97706','Puma Paz':'#059669'
};

// Operating thresholds (defaults; per-set overrides come from config)
const IDEAL_PCT = 0.90;
const MIN_PCT   = 0.50;
const WARN_PCT  = 0.65;

// Morning levels are read ~6:30 AM; sales accrue through the operating day.
// Used to estimate how much a tank has drained by a given descarga time.
const MORNING_HOUR  = 6.5;
const DAY_END_HOUR  = 22;   // assume the day's sales spread from ~6:30 to ~22:00
// Estimated gallons sold by a given clock time (HH:MM), prorating the day's sale
function estSoldByTime(daySale, timeStr) {
  if (!timeStr || !daySale) return 0;
  const [h, m] = String(timeStr).split(':').map(Number);
  if (isNaN(h)) return 0;
  const t = h + (m || 0) / 60;
  const frac = Math.max(0, Math.min(1, (t - MORNING_HOUR) / (DAY_END_HOUR - MORNING_HOUR)));
  return daySale * frac;
}

// Per-set threshold helpers — Set 2 has lower min/ideal than Set 1
function getMinPct(config, setName) {
  if (setName === 'Set 2') return (config.jutaSet2MinPct ?? 40) / 100;
  if (setName === 'Set 1') return (config.jutaSet1MinPct ?? 50) / 100;
  return (config.minPct ?? 50) / 100;
}
function getIdealPct(config, setName) {
  if (setName === 'Set 2') return (config.jutaSet2IdealPct ?? 75) / 100;
  if (setName === 'Set 1') return (config.jutaSet1IdealPct ?? 90) / 100;
  return (config.idealPct ?? 90) / 100;
}

// Default cisternas
const DEFAULT_CISTERNAS = {
  '923': [2500,2500,1100,900,1000],
  '6738':[2000,2000,2000,1000,1000],
  '1909':[2000,2000,1500,500,900,1100],
  '7150':[3000,2500,1500,1000]
};

// Pre-configured ordering groups
const DEFAULT_ORDER_GROUPS = [
  { id:'jut', name:'Juticalpa / Limones', desc:'~2x semana. Limones se une según necesidad.',
    stations:['Puma Juticalpa','Limones'], cisternas:['923','6738','1909'] },
  { id:'las', name:'Las Delicias / Puma Paz / La Granja', desc:'Solo Cisterna 7150, siempre compartida.',
    stations:['Las Delicias','Puma Paz','La Granja'], cisternas:['7150'] }
];

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
const fmt  = n => new Intl.NumberFormat('en-US').format(Math.round(n ?? 0));
const fmtG = n => `${fmt(n)} gal`;
const pct  = (n, max) => max > 0 ? Math.round((n / max) * 100) : 0;
const isJuta = s => s === 'Puma Juticalpa';

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}
function getTodayStr() { return new Date().toISOString().split('T')[0]; }
function dayLabel(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return `${DAYS_ES[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function dayName(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return DAYS_ES[d.getDay()];
}

// ═══════════════════════════════════════════════════════════
// DATA ACCESS  (pure functions over dailyLog)
// ═══════════════════════════════════════════════════════════
function getMorning(log, station, date, fuel, setName) {
  const e = log[station]?.[date];
  if (!e) return null;
  return isJuta(station) ? (e.morning?.[setName]?.[fuel] ?? null) : (e.morning?.[fuel] ?? null);
}
function getDescarga(log, station, date, fuel, setName) {
  // Only fuel physically delivered into underground tanks (status: delivered)
  const e = log[station]?.[date];
  if (!e) return 0;
  return isJuta(station) ? (e.descarga?.[setName]?.[fuel] ?? 0) : (e.descarga?.[fuel] ?? 0);
}
// Manually confirmed sale entered from the POS/pump system
function getConfirmedSale(log, station, date, fuel, setName) {
  const e = log[station]?.[date];
  if (!e || !e.confirmedSale) return null;
  return isJuta(station) ? (e.confirmedSale?.[setName]?.[fuel] ?? null) : (e.confirmedSale?.[fuel] ?? null);
}
// Flag a sale as anomalous: zero when avg>0, or deviates >60% from weekday average
function isAnomalous(sale, avg) {
  if (sale === null) return false;
  if (avg === null || avg === 0) return sale === 0;
  const ratio = sale / avg;
  return ratio < 0.4 || ratio > 2.5;
}
// Sale for date D = morning[D] + descarga[D] - morning[D+1]
function getSale(log, station, date, fuel, setName) {
  const m0 = getMorning(log, station, date, fuel, setName);
  const m1 = getMorning(log, station, addDays(date,1), fuel, setName);
  if (m0 === null || m1 === null) return null;
  const desc = getDescarga(log, station, date, fuel, setName);
  return Math.max(0, m0 + desc - m1);
}
// Forecast = avg of same weekday 1 and 2 weeks ago; fallback to whichever exists; null if neither
function getForecast(log, station, targetDate, fuel, setName, holidayOverride) {
  if (holidayOverride != null) return holidayOverride;
  const s1 = getSale(log, station, addDays(targetDate,-7), fuel, setName);
  const s2 = getSale(log, station, addDays(targetDate,-14), fuel, setName);
  if (s1 !== null && s2 !== null) return (s1+s2)/2;
  if (s1 !== null) return s1;
  if (s2 !== null) return s2;
  return null;
}
function getMaxCap(config, station, fuel, setName) {
  if (isJuta(station)) return config.stationConfig[station]?.sets?.[setName]?.[fuel]?.max ?? 0;
  return config.stationConfig[station]?.fuels?.[fuel]?.max ?? 0;
}
// ═══════════════════════════════════════════════════════════
// CISTERNA ARRIVALS  (source of truth for trucks & compartments)
// ═══════════════════════════════════════════════════════════
// arrivals = { [station]: [ { id, cistId, arrivalDate, notes, comps:[
//   { vol, plannedSet, plannedFuel, actualSet, actualFuel, status:'pending'|'delivered', deliveredDate } ] } ] }
function makeArrivalId() { return 'a_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

// Normalize an old descComp ({set,fuel}) or new comp into the planned/actual shape
function normalizeComp(c) {
  if (!c) return null;
  if (c.plannedFuel !== undefined || c.actualFuel !== undefined) {
    return { plannedSet:c.plannedSet||'', plannedFuel:c.plannedFuel||'', actualSet:c.actualSet||'', actualFuel:c.actualFuel||'', status:c.status||'delivered' };
  }
  return { plannedSet:c.set||'', plannedFuel:c.fuel||'', actualSet:c.set||'', actualFuel:c.fuel||'', status:c.status||'delivered' };
}

// Gallons still in trucks (status pending) for a station/fuel(/set), arrived on or before asOfDate
function pendingNow(arrivals, station, fuel, setName, asOfDate) {
  const list = arrivals?.[station] || [];
  let t = 0;
  for (const a of list) {
    if (asOfDate && a.arrivalDate > asOfDate) continue;
    for (const c of a.comps || []) {
      if (c.status !== 'pending') continue;
      const f = c.plannedFuel || c.actualFuel;
      const s = c.plannedSet  || c.actualSet;
      if (f !== fuel) continue;
      if (isJuta(station) && s !== setName) continue;
      t += c.vol || 0;
    }
  }
  return t;
}

// Build a read-view of dailyLog whose `descarga` is derived from arrivals (delivered comps,
// bucketed by deliveredDate). Morning levels / confirmedSale / requested / notes pass through.
function buildLogView(dailyLog, arrivals) {
  const view = JSON.parse(JSON.stringify(dailyLog || {}));
  const derived = {}; // station -> date -> descarga object
  for (const [station, list] of Object.entries(arrivals || {})) {
    for (const a of list || []) {
      for (const c of a.comps || []) {
        if (c.status !== 'delivered' || !c.deliveredDate || !c.actualFuel) continue;
        const d = c.deliveredDate;
        derived[station] = derived[station] || {};
        derived[station][d] = derived[station][d] || {};
        const bucket = derived[station][d];
        if (isJuta(station)) {
          const s = c.actualSet; if (!s) continue;
          bucket[s] = bucket[s] || {};
          bucket[s][c.actualFuel] = (bucket[s][c.actualFuel] || 0) + (c.vol || 0);
        } else {
          bucket[c.actualFuel] = (bucket[c.actualFuel] || 0) + (c.vol || 0);
        }
      }
    }
  }
  const stations = new Set([...Object.keys(view), ...Object.keys(derived)]);
  for (const station of stations) {
    view[station] = view[station] || {};
    const dates = new Set([...Object.keys(view[station]), ...Object.keys(derived[station] || {})]);
    for (const d of dates) {
      view[station][d] = view[station][d] || {};
      view[station][d].descarga = (derived[station] && derived[station][d]) ? derived[station][d] : {};
    }
  }
  return view;
}

// One-time migration: turn legacy dailyLog descCistId/descComps (and any manual descarga)
// into arrival records, so no historical delivery is lost.
function migrateToArrivals(dailyLog, cisternas) {
  const arrivals = {};
  const push = (station, arr) => { arrivals[station] = arrivals[station] || []; arrivals[station].push(arr); };
  for (const [station, days] of Object.entries(dailyLog || {})) {
    for (const [date, entry] of Object.entries(days || {})) {
      if (!entry) continue;
      const hasComps = entry.descComps && Object.keys(entry.descComps).length > 0;
      if (hasComps && entry.descCistId) {
        const vols = cisternas[entry.descCistId] || [];
        const comps = [];
        for (const [idx, raw] of Object.entries(entry.descComps)) {
          const mc = normalizeComp(raw); if (!mc) continue;
          comps.push({ vol: vols[parseInt(idx)] ?? 0, plannedSet:mc.plannedSet, plannedFuel:mc.plannedFuel,
            actualSet:mc.actualSet, actualFuel:mc.actualFuel, status:mc.status,
            deliveredDate: mc.status === 'delivered' ? date : null });
        }
        if (comps.length) push(station, { id:makeArrivalId(), cistId:entry.descCistId, arrivalDate:date, comps, notes:'' });
      } else if (entry.descarga) {
        // manual-only descarga (no compartment detail) → synthetic record
        const comps = [];
        if (isJuta(station)) {
          for (const [sn, fuels] of Object.entries(JUTA_SETS)) for (const f of fuels) {
            const v = entry.descarga?.[sn]?.[f] || 0;
            if (v > 0) comps.push({ vol:v, plannedSet:sn, plannedFuel:f, actualSet:sn, actualFuel:f, status:'delivered', deliveredDate:date });
          }
        } else {
          for (const f of FUELS) {
            const v = entry.descarga?.[f] || 0;
            if (v > 0) comps.push({ vol:v, plannedSet:'', plannedFuel:f, actualSet:'', actualFuel:f, status:'delivered', deliveredDate:date });
          }
        }
        if (comps.length) push(station, { id:makeArrivalId(), cistId: entry.descCistId || 'Manual', arrivalDate:date, comps, notes:'' });
      }
    }
  }
  return arrivals;
}

// ═══════════════════════════════════════════════════════════
// OPTIMIZATION
// ═══════════════════════════════════════════════════════════
// Single station, Juticalpa-aware:
//   targets/maxSpace: { 'Set 1': { Regular: X, ... }, 'Set 2': { Super: X, ... } }  (Juticalpa)
//                  or { fuel: X }  (simple)
// Returns array of { set, fuel } or { set: null, fuel } or null per compartment
function optimizeJuta(comps, targets, maxSpace) {
  const options = [];
  for (const [setName, fuels] of Object.entries(JUTA_SETS))
    for (const fuel of fuels) options.push({ set: setName, fuel });
  options.push(null);
  const n = comps.length;
  let bestScore = Infinity, bestAssign = null;
  function run(idx, assign, totals) {
    if (idx === n) {
      for (const [s, fuels] of Object.entries(JUTA_SETS))
        for (const f of fuels)
          if ((totals[s]?.[f]??0) > (maxSpace[s]?.[f]??0)+0.5) return;
      let score = 0;
      for (const [s, fuels] of Object.entries(JUTA_SETS))
        for (const f of fuels)
          score += Math.pow(((targets[s]?.[f]??0)-(totals[s]?.[f]??0)),2);
      if (score < bestScore) { bestScore = score; bestAssign = [...assign]; }
      return;
    }
    for (const opt of options) {
      assign[idx] = opt;
      let newTotals = totals;
      if (opt) {
        newTotals = JSON.parse(JSON.stringify(totals));
        if (!newTotals[opt.set]) newTotals[opt.set] = {};
        newTotals[opt.set][opt.fuel] = (newTotals[opt.set][opt.fuel]??0) + comps[idx];
      }
      run(idx+1, assign, newTotals);
    }
  }
  run(0, Array(n).fill(null), {});
  return bestAssign ?? Array(n).fill(null);
}

function optimizeSimple(comps, targets, maxSpace) {
  const options = [...FUELS, null];
  const n = comps.length;
  let bestScore = Infinity, bestAssign = null;
  function run(idx, assign, totals) {
    if (idx === n) {
      for (const f of FUELS) if ((totals[f]??0)>(maxSpace[f]??0)+0.5) return;
      let score = 0;
      for (const f of FUELS) score += Math.pow(((targets[f]??0)-(totals[f]??0)),2);
      if (score < bestScore) { bestScore = score; bestAssign = [...assign]; }
      return;
    }
    for (const opt of options) {
      assign[idx] = opt;
      run(idx+1, assign, opt ? {...totals,[opt]:(totals[opt]??0)+comps[idx]} : totals);
    }
  }
  run(0, Array(n).fill(null), {});
  return bestAssign ?? Array(n).fill(null);
}

function autoOptimize(comps, stations, targets, maxSpace) {
  if (stations.length === 1) {
    const s = stations[0];
    if (isJuta(s)) {
      const a = optimizeJuta(comps, targets[s], maxSpace[s]);
      return a.map(v => v ? { station:s, ...v } : null);
    } else {
      const a = optimizeSimple(comps, targets[s], maxSpace[s]);
      return a.map(v => v ? { station:s, set:null, fuel:v } : null);
    }
  }
  // Multi-station: greedy station assignment, then optimize within each
  const totalNeed = {};
  for (const s of stations) {
    if (isJuta(s)) totalNeed[s] = Object.values(targets[s]).reduce((t,fs) => t+Object.values(fs).reduce((a,b)=>a+b,0),0);
    else totalNeed[s] = Object.values(targets[s]).reduce((a,b)=>a+b,0);
  }
  const sortedComps = comps.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
  const stComps = Object.fromEntries(stations.map(s=>[s,[]]));
  const rem = {...totalNeed};
  for (const {v,i} of sortedComps) {
    const s = stations.reduce((best,s) => rem[s]>rem[best]?s:best, stations[0]);
    stComps[s].push({v,i});
    rem[s] -= v;
  }
  const fullAssign = Array(comps.length).fill(null);
  for (const s of stations) {
    const sc = stComps[s];
    if (!sc.length) continue;
    if (isJuta(s)) {
      const a = optimizeJuta(sc.map(x=>x.v), targets[s], maxSpace[s]);
      sc.forEach(({i},j) => { if (a[j]) fullAssign[i] = { station:s, ...a[j] }; });
    } else {
      const a = optimizeSimple(sc.map(x=>x.v), targets[s], maxSpace[s]);
      sc.forEach(({i},j) => { if (a[j]) fullAssign[i] = { station:s, set:null, fuel:a[j] }; });
    }
  }
  return fullAssign;
}

      }},

      'Las Delicias': { type:'simple', fuels:{ Regular:{max:10000}, Super:{max:10000}, Diesel:{max:10000} }},
      'La Granja':    { type:'simple', fuels:{ Regular:{max:10000}, Super:{max:10000}, Diesel:{max:10000} }},
      'Puma Paz':     { type:'simple', fuels:{ Regular:{max:10000}, Super:{max:10000}, Diesel:{max:10000} }}
    }
  };
}

// ═══════════════════════════════════════════════════════════
// PERSISTENCE (localStorage fallback OR Firebase Firestore)
// ═══════════════════════════════════════════════════════════
const LOCAL_KEY = 'gas_mgr_v5';
let _db   = null;
let _auth = null;
let _docRef = null;
let _cloudMode = false;

try {
  if (FIREBASE_CONFIG) {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    _db   = firebase.firestore(app);
    _auth = firebase.auth(app);
    _docRef = _db.collection('gasolineras').doc('datos');
    _cloudMode = true;
  }
} catch(e) {
  console.warn('Firebase init failed — falling back to localStorage', e);
}

const IS_CLOUD = _cloudMode;

async function loadStateAsync() {
  if (IS_CLOUD) {
    try {
      const snap = await _docRef.get();
      return snap.exists ? snap.data() : null;
    } catch(e) {
      console.warn('Firestore load failed, trying localStorage', e);
    }
  }
  try { const s=localStorage.getItem(LOCAL_KEY); return s?JSON.parse(s):null; } catch { return null; }
}

async function saveStateAsync(s) {
  if (IS_CLOUD) {
    await _docRef.set(s);
  }
  // Always also mirror to localStorage as offline backup
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch {}
}

function subscribeToCloud(callback) {
  if (!IS_CLOUD) return () => {};
  return _docRef.onSnapshot(snap => {
    if (snap.exists) callback(snap.data());
  }, err => console.warn('Snapshot error', err));
}

// ── Auth helpers ──
function onAuthChange(callback) {
  if (!IS_CLOUD) { callback({ uid:'local', email:'local' }); return () => {}; }
  return _auth.onAuthStateChanged(callback);
}
async function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  // Prompt account picker every time (useful when you have multiple Google accounts)
  provider.setCustomParameters({ prompt: 'select_account' });
  return _auth.signInWithPopup(provider);
}
function signOut() {
  if (_auth) return _auth.signOut();
}
function authErrorMessage(code) {
  const m = {
    'auth/popup-blocked':         'El navegador bloqueó la ventana emergente. Permite ventanas emergentes para este sitio e intenta de nuevo.',
    'auth/popup-closed-by-user':  '', // user closed popup, no message needed
    'auth/unauthorized-domain':   'Este dominio no está autorizado en Firebase. Agrega el dominio en Authentication → Dominios autorizados.',
    'auth/network-request-failed':'Sin conexión a internet.',
    'auth/user-disabled':         'Esta cuenta ha sido desactivada.',
  };
  return m[code] ?? (code === 'auth/popup-closed-by-user' ? '' : 'Error al iniciar sesión. Intenta de nuevo.');
}

  title:   { fontSize:16, fontWeight:700, color:'#1e3a5f', marginBottom:16 },
  label:   { display:'block', fontSize:11, fontWeight:700, color:'#94a3b8', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.5px' },
  input:   { width:'100%', padding:'8px 12px', border:'1px solid #d1d5db', borderRadius:8, fontSize:14, color:'#1e293b', background:'white' },
  inputSm: { padding:'6px 8px', border:'1px solid #d1d5db', borderRadius:6, fontSize:13, color:'#1e293b', background:'white', width:'100%' },
  btn:     { padding:'9px 18px', borderRadius:8, border:'none', cursor:'pointer', fontWeight:600, fontSize:14 },
  tankBar: { height:8, background:'#e2e8f0', borderRadius:4, overflow:'hidden', position:'relative' },
  tankFill:{ height:'100%', borderRadius:4, transition:'width 0.3s' },
  stBar:   { display:'flex', gap:8, flexWrap:'wrap', marginBottom:20 },
  stBtn:   (active, col) => ({ padding:'8px 16px', borderRadius:20, border:`2px solid ${active?col:'#e2e8f0'}`, background:active?col:'white', color:active?'white':'#64748b', cursor:'pointer', fontSize:13, fontWeight:600 }),
  alert:   (t) => {
    const m={warn:['#fef3c7','#f59e0b','#92400e'],danger:['#fee2e2','#f87171','#991b1b'],ok:['#d1fae5','#34d399','#065f46'],info:['#dbeafe','#60a5fa','#1e40af']};
    const [bg,border,col]=m[t]||m.info;
    return {padding:'10px 14px',borderRadius:8,marginBottom:10,display:'flex',alignItems:'flex-start',gap:8,fontSize:13,background:bg,border:`1px solid ${border}`,color:col};
  },
  th: { background:'#f8fafc', padding:'9px 12px', textAlign:'center', fontWeight:600, color:'#64748b', borderBottom:'2px solid #e2e8f0', fontSize:13, whiteSpace:'nowrap' },
  td: { padding:'9px 12px', textAlign:'center', borderBottom:'1px solid #f1f5f9', fontSize:13 },
};

// ═══════════════════════════════════════════════════════════
// ACCUMULATE INPUT — lets you add multiple compartment values
// ═══════════════════════════════════════════════════════════
function AccumInput({ value, onChange, style, placeholder }) {
  const [addStr, setAddStr] = useState('');
  const [open,   setOpen]   = useState(false);
  function apply() {
    const n = parseFloat(addStr);
    if (!isNaN(n) && n > 0) onChange((parseFloat(value) || 0) + n);
    setAddStr(''); setOpen(false);
  }
  return (
    <div style={{ display:'flex', gap:4, alignItems:'center', flexWrap:'wrap' }}>
      <input type="number" min="0" value={value??''} placeholder={placeholder||'0'}
        onChange={e => onChange(e.target.value===''?null:+e.target.value)}
        style={style} />
      <button type="button" onClick={() => setOpen(p=>!p)} title="Acumular valores"
        style={{ padding:'4px 8px', border:'1px solid #d1d5db', borderRadius:6, background:'#f8fafc', cursor:'pointer', fontSize:13, color:'#64748b', flexShrink:0 }}>
        +
      </button>
      {open && (
        <>
          <input type="number" min="0" value={addStr} placeholder="añadir…"
            onChange={e=>setAddStr(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&apply()}
            autoFocus
            style={{ width:80, padding:'4px 6px', border:'1px solid #d1d5db', borderRadius:6, fontSize:13 }} />
          <button type="button" onClick={apply}
            style={{ padding:'4px 8px', border:'none', borderRadius:6, background:'#1e3a5f', color:'white', cursor:'pointer', fontSize:13 }}>✓</button>
        </>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// LEVEL INDICATOR (reused everywhere)
// ═══════════════════════════════════════════════════════════
function LevelBar({ level, max, color, minPct, idealPct }) {
  const mp = minPct  ?? MIN_PCT;
  const ip = idealPct ?? IDEAL_PCT;
  const p = max > 0 ? Math.min(100, (level/max)*100) : 0;
  const barCol = p < mp*100 ? '#ef4444' : p < WARN_PCT*100 ? '#f59e0b' : color;
  return (
    <div>
      <div style={{ ...S.tankBar, marginTop:6 }}>
        <div style={{ ...S.tankFill, width:`${p}%`, background:barCol }} />
        <div style={{ position:'absolute', top:0, left:`${mp*100}%`, width:2, height:'100%', background:'#ef444460' }} />
        <div style={{ position:'absolute', top:0, left:`${ip*100}%`, width:2, height:'100%', background:'#05966960' }} />
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:'#94a3b8', marginTop:2 }}>
        <span style={{ color:barCol, fontWeight:p<WARN_PCT*100?700:400 }}>{Math.round(p)}%</span>
        <span>{fmt(level)} / {fmt(max)} gal</span>
      </div>
    </div>
  );
}

// CONFIG TAB
// ═══════════════════════════════════════════════════════════
function ConfigTab({ config, setConfig, cisternas, setCisternas }) {
  const [st, setSt] = useState('Puma Juticalpa');
  const [newId, setNewId] = useState('');
  const [newComps, setNewComps] = useState('');

  function updJutaMax(setName, fuel, val) {
    setConfig(p => { const n=JSON.parse(JSON.stringify(p)); n.stationConfig['Puma Juticalpa'].sets[setName][fuel].max=+val||0; return n; });
  }
  function updSimpleMax(station, fuel, val) {
    setConfig(p => { const n=JSON.parse(JSON.stringify(p)); n.stationConfig[station].fuels[fuel].max=+val||0; return n; });
  }
  function updGlobal(field, val) {
    setConfig(p => ({ ...p, [field]: +val||0 }));
  }
  function addCisterna() {
    const id = newId.trim();
    const comps = newComps.split(',').map(s=>+s.trim()).filter(n=>n>0);
    if (!id||!comps.length) return;
    setCisternas(p => ({ ...p, [id]:comps }));
    setNewId(''); setNewComps('');
  }
  function delCisterna(id) { setCisternas(p=>{ const n={...p}; delete n[id]; return n; }); }

  const cfg = config.stationConfig[st];

  return (
    <div>
      {/* Global settings */}
      <div style={S.card}>
        <div style={S.title}>🎯 Parámetros Globales</div>

        {/* Non-Juticalpa stations */}
        <div style={{ marginBottom:16 }}>
          <div style={{ fontWeight:600, color:'#64748b', fontSize:13, marginBottom:10 }}>Las Delicias · La Granja (gasolineras simples)</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }} className="g2">
            <div>
              <label style={S.label}>Nivel mínimo (%)</label>
              <input style={S.input} type="number" min="0" max="100" value={config.minPct||50} onChange={e=>updGlobal('minPct',e.target.value)} />
              <div style={{ fontSize:12, color:'#64748b', marginTop:4 }}>⚠️ Alertar cuando el nivel proyectado baje de este %</div>
            </div>
            <div>
              <label style={S.label}>Nivel ideal / objetivo (%)</label>
              <input style={S.input} type="number" min="0" max="100" value={config.idealPct||90} onChange={e=>updGlobal('idealPct',e.target.value)} />
              <div style={{ fontSize:12, color:'#64748b', marginTop:4 }}>🎯 Llenar hasta este % al hacer un pedido</div>
            </div>
          </div>
        </div>

        {/* Juticalpa Set 1 */}
        <div style={{ marginBottom:12, padding:14, background:'#f8fafc', borderRadius:10, borderLeft:`4px solid ${SET_COLORS['Set 1']}` }}>
          <div style={{ fontWeight:700, color:SET_COLORS['Set 1'], fontSize:13, marginBottom:10 }}>🛢️ Puma Juticalpa — Set 1</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }} className="g2">
            <div>
              <label style={S.label}>Nivel mínimo (%)</label>
              <input style={S.input} type="number" min="0" max="100" value={config.jutaSet1MinPct??50} onChange={e=>updGlobal('jutaSet1MinPct',e.target.value)} />
            </div>
            <div>
              <label style={S.label}>Nivel ideal (%)</label>
              <input style={S.input} type="number" min="0" max="100" value={config.jutaSet1IdealPct??90} onChange={e=>updGlobal('jutaSet1IdealPct',e.target.value)} />
            </div>
          </div>
        </div>

        {/* Juticalpa Set 2 */}
        <div style={{ padding:14, background:'#f8fafc', borderRadius:10, borderLeft:`4px solid ${SET_COLORS['Set 2']}` }}>
          <div style={{ fontWeight:700, color:SET_COLORS['Set 2'], fontSize:13, marginBottom:10 }}>🛢️ Puma Juticalpa — Set 2</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }} className="g2">
            <div>
              <label style={S.label}>Nivel mínimo (%)</label>
              <input style={S.input} type="number" min="0" max="100" value={config.jutaSet2MinPct??40} onChange={e=>updGlobal('jutaSet2MinPct',e.target.value)} />
            </div>
            <div>
              <label style={S.label}>Nivel ideal (%)</label>
              <input style={S.input} type="number" min="0" max="100" value={config.jutaSet2IdealPct??75} onChange={e=>updGlobal('jutaSet2IdealPct',e.target.value)} />
            </div>
          </div>
        </div>
      </div>

      {/* Station config */}
      <div style={S.stBar}>
        {STATIONS.map(s => <button key={s} style={S.stBtn(st===s, STATION_COLORS[s])} onClick={()=>setSt(s)}>{s}</button>)}
      </div>

      <div style={S.card}>
        <div style={S.title}>🏗️ Capacidad de Tanques — {st}</div>
        {st === 'Puma Juticalpa' ? (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }} className="g2">
            {Object.entries(JUTA_SETS).map(([setName, fuels]) => (
              <div key={setName} style={{ border:`2px solid ${SET_COLORS[setName]}`, borderRadius:10, padding:16 }}>
                <div style={{ fontWeight:700, color:SET_COLORS[setName], marginBottom:12, fontSize:15 }}>🛢️ {setName}</div>
                {fuels.map(fuel => (
                  <div key={fuel} style={{ marginBottom:10 }}>
                    <label style={{ ...S.label, color:FUEL_COLORS[fuel] }}>{FUEL_ICONS[fuel]} {fuel} (gal)</label>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16 }} className="g3">
            {FUELS.map(fuel => (

                <input style={S.input} type="number" min="0" value={cfg?.fuels?.[fuel]?.max||''} onChange={e=>updSimpleMax(st,fuel,e.target.value)} placeholder="0" />
              </div>
            ))}

        )}
      </div>

      {/* Cisternas */}
      <div style={S.card}>
        <div style={S.title}>🚛 Cisternas Registradas</div>
        {Object.entries(cisternas).map(([id, comps]) => {
          const total = comps.reduce((a,b)=>a+b,0);
          return (
            <div key={id} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 0', borderBottom:'1px solid #f1f5f9' }}>
              <div style={{ fontWeight:700, minWidth:90, color:'#1e3a5f' }}>Cisterna {id}</div>
              <div style={{ display:'flex', gap:6, flex:1, flexWrap:'wrap', alignItems:'center' }}>
                {comps.map((c,i)=><span key={i} style={{ background:'#f1f5f9', border:'1px solid #e2e8f0', borderRadius:6, padding:'3px 9px', fontSize:12, fontWeight:600 }}>C{i+1}: {c.toLocaleString()}</span>)}
                <span style={{ fontSize:12, color:'#64748b', fontWeight:700 }}>= {total.toLocaleString()} gal</span>
              </div>
              <button onClick={()=>delCisterna(id)} style={{ ...S.btn, background:'#fee2e2', color:'#dc2626', padding:'5px 12px', fontSize:12 }}>✕</button>

        <div style={{ display:'grid', gridTemplateColumns:'110px 1fr auto', gap:10, alignItems:'end', marginTop:16 }}>
          <div><label style={S.label}>ID</label><input style={S.input} type="text" value={newId} onChange={e=>setNewId(e.target.value)} placeholder="ej: 5555" /></div>
          <div><label style={S.label}>Compartimentos (gal, separados por comas)</label><input style={S.input} type="text" value={newComps} onChange={e=>setNewComps(e.target.value)} placeholder="ej: 2000, 3000, 3000" /></div>
          <button style={{ ...S.btn, background:'#1e3a5f', color:'white' }} onClick={addCisterna}>+ Agregar</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// DAILY LOG TAB  — enter morning levels + descargas
// ═══════════════════════════════════════════════════════════
function DailyLogTab({ config, dailyLog, setDailyLog, arrivals, nextCisterna, setNextCisterna, cisternas }) {
  const [date, setDate] = useState(getTodayStr());
  const [st, setSt] = useState('Puma Juticalpa');
  const [draft, setDraft] = useState({});
  const [anomalyOk, setAnomalyOk] = useState({});  // keys confirmed by operator

  function emptyDraft(station) {
    if (isSupplyOnly(station)) return { requested:{}, notes:'' };
    if (isJuta(station)) {
      const morning = {}, confirmedSale = {};
      for (const [sn, fuels] of Object.entries(JUTA_SETS)) {
        morning[sn]={}; confirmedSale[sn]={};
        for (const f of fuels) { morning[sn][f]=null; confirmedSale[sn][f]=null; }
      }
      return { morning, confirmedSale, notes:'' };
    } else {
      const morning={}, confirmedSale={};
      for (const f of FUELS) { morning[f]=null; confirmedSale[f]=null; }
      return { morning, confirmedSale, notes:'' };
    }
  }

  useEffect(() => {
    const existing = dailyLog[st]?.[date];
    if (existing) setDraft(JSON.parse(JSON.stringify(existing)));
    else setDraft(emptyDraft(st));
    setAnomalyOk({});
  }, [date, st]);

  // ── Anomaly detection: implied sale vs 2-week weekday average ──
  const anomalies = useMemo(() => {
    if (isSupplyOnly(st)) return [];
    const prevDate = addDays(date, -1);
    const result = [];
    const check = (fuel, setName, key) => {
      const m0 = getMorning(dailyLog, st, prevDate, fuel, setName);
      const m1 = isJuta(st) ? (draft.morning?.[setName]?.[fuel] ?? null) : (draft.morning?.[fuel] ?? null);
      if (m0 === null || m1 === null) return;
      const desc = getDescarga(dailyLog, st, prevDate, fuel, setName);
      const sale = Math.max(0, m0 + desc - m1);
      const avg  = getForecast(dailyLog, st, prevDate, fuel, setName, null);
      if (!isAnomalous(sale, avg)) return;
      const reason = sale === 0 ? 'Venta en cero' : `${Math.round(Math.abs(sale/(avg||1)-1)*100)}% desviación del promedio (${fmt(avg)} gal)`;
      result.push({ key, fuel, setName, sale, avg, reason });
    };
    if (isJuta(st)) {
      for (const [sn, fuels] of Object.entries(JUTA_SETS)) fuels.forEach(f => check(f, sn, `${sn}_${f}`));
    } else {
      FUELS.forEach(f => check(f, null, `null_${f}`));
    }
    return result;
  }, [draft.morning, date, st, dailyLog]);

  const unconfirmedAnomalies = anomalies.filter(a => !anomalyOk[a.key]);
  const canSave = unconfirmedAnomalies.length === 0;

  function setMorning(fuel, setName, val) {
    setDraft(p => {
      const n = JSON.parse(JSON.stringify(p));
      if (!n.morning) n.morning = {};
      if (setName) { if(!n.morning[setName]) n.morning[setName]={}; n.morning[setName][fuel] = val===''?null:+val; }
      else n.morning[fuel] = val===''?null:+val;
      return n;
    });
  }
  function setConfirmedSale(fuel, setName, val) {
    setDraft(p => {
      const n = JSON.parse(JSON.stringify(p));
      if (!n.confirmedSale) n.confirmedSale = {};
      if (setName) {
        if (!n.confirmedSale[setName]) n.confirmedSale[setName] = {};
        n.confirmedSale[setName][fuel] = val===null?null:(+val||0);
      } else {
        n.confirmedSale[fuel] = val===null?null:(+val||0);
      }
      return n;
    });
  }

  // Save only the fields owned by this tab; descarga is derived from the Cisternas tab.
  function saveEntry() {
    setDailyLog(p => {
      const n = JSON.parse(JSON.stringify(p));
      if (!n[st]) n[st] = {};
      const old = n[st][date] || {};
      if (isSupplyOnly(st)) {
        n[st][date] = { ...old, requested: draft.requested || {}, notes: draft.notes || '' };
      } else {
        n[st][date] = { ...old, morning: draft.morning, confirmedSale: draft.confirmedSale, notes: draft.notes || '' };
      }
      return n;
    });
    alert(`✅ Entrada guardada: ${st} — ${dayLabel(date)}`);
  }

  const prevDate = addDays(date, -1);
  const entryExists = !!dailyLog[st]?.[date];
  const cistList = Object.keys(cisternas);

  // Delivered today (derived) + still-pending-in-trucks (as of this date), for read-only summary
  const deliveredToday = {}, pendingTrucks = {};
  if (!isSupplyOnly(st)) {
    const keys = isJuta(st) ? Object.entries(JUTA_SETS).flatMap(([sn,fs])=>fs.map(f=>({sn,f}))) : FUELS.map(f=>({sn:null,f}));
    for (const {sn,f} of keys) {
      const dv = getDescarga(dailyLog, st, date, f, sn);
      const pv = pendingNow(arrivals, st, f, sn, date);
      if (dv>0) (deliveredToday[sn||'_'] = deliveredToday[sn||'_']||{})[f] = dv;
      if (pv>0) (pendingTrucks[sn||'_'] = pendingTrucks[sn||'_']||{})[f] = pv;
    }
  }
  const hasDelivered = Object.keys(deliveredToday).length>0;
  const hasPending   = Object.keys(pendingTrucks).length>0;

  // ── Header bar ──
  const header = (
    <div style={{ display:'grid', gridTemplateColumns:'170px 1fr 220px', gap:14, marginBottom:16 }} className="g3">
      <div style={S.card}>
        <label style={S.label}>📅 Fecha</label>
        <input style={S.input} type="date" value={date} onChange={e=>setDate(e.target.value)} />
        <div style={{ fontSize:11, color:'#64748b', marginTop:5 }}>{dayLabel(date)}{entryExists?' ✅ Guardado':' ⬜ Sin datos'}</div>
      </div>
      <div style={{ ...S.card, display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', padding:'12px 18px' }}>
        {STATIONS.map(s=><button key={s} style={S.stBtn(st===s,STATION_COLORS[s])} onClick={()=>setSt(s)}>{s}{isSupplyOnly(s)?' 📦':''}</button>)}
      </div>
      <div style={S.card}>
        <label style={S.label}>🚛 Próxima Cisterna</label>
        <select style={S.input} value={nextCisterna?.[st]||''} onChange={e=>setNextCisterna(p=>({...p,[st]:e.target.value}))}>
          <option value="">— Sin seleccionar —</option>
          {cistList.map(id=><option key={id} value={id}>Cisterna {id} ({(cisternas[id]||[]).reduce((a,b)=>a+b,0).toLocaleString()} gal)</option>)}
        </select>
        <div style={{ fontSize:11, color:'#64748b', marginTop:4 }}>Para el próximo pedido</div>
      </div>
    </div>
  );

  // ════════════════════════════════════════
  // SUPPLY-ONLY STATION (Limones, Puma Paz)
  // ════════════════════════════════════════
  if (isSupplyOnly(st)) {
    return (
      <div>
        {header}
        <div style={S.card}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
            <div style={S.title}>📦 Solicitud de Suministro — {st} — {dayLabel(date)}</div>
            <button style={{ ...S.btn, background:'#1e3a5f', color:'white' }} onClick={saveEntry}>💾 Guardar</button>
          </div>
          <div style={S.alert('info')}>
            ℹ️ {st} es una estación de suministro externo. Registra cuánto combustible necesitan.
          </div>
          <div style={{ display:'flex', gap:14, flexWrap:'wrap', marginBottom:16 }}>
            {FUELS.map(fuel => {
              const val = draft.requested?.[fuel] ?? null;
              return (
                <div key={fuel} style={{ padding:14, background:FUEL_LIGHT[fuel], borderRadius:10, borderLeft:`4px solid ${FUEL_COLORS[fuel]}`, flex:'1 1 160px' }}>
                  <div style={{ fontWeight:700, color:FUEL_COLORS[fuel], marginBottom:10 }}>{FUEL_ICONS[fuel]} {fuel}</div>
                  <AccumInput
                    value={val}
                    onChange={v=>setDraft(p=>({...p,requested:{...(p.requested||{}),[fuel]:v}}))}
                    style={{ ...S.inputSm, borderColor:FUEL_COLORS[fuel] }}
                    placeholder="0 gal"
                  />
                  {val>0 && <div style={{ fontSize:11, color:FUEL_COLORS[fuel], marginTop:4, fontWeight:600 }}>{fmt(val)} gal solicitados</div>}
                </div>
              );
            })}
          </div>
          <label style={S.label}>Notas</label>
          <input style={S.input} type="text" value={draft.notes||''} onChange={e=>setDraft(p=>({...p,notes:e.target.value}))} placeholder="Observaciones..." />
        </div>
      </div>
    );
  }

  // ════════════════════════════════════════
  // REGULAR STATION (Juticalpa, Las Delicias, La Granja)
  // ════════════════════════════════════════
  return (
    <div>
      {header}
      <div style={S.card}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <div style={S.title}>📋 Registro — {st} — {dayLabel(date)}</div>
          <button
            style={{ ...S.btn, background:canSave?'#1e3a5f':'#94a3b8', color:'white' }}
            onClick={canSave?saveEntry:undefined}
            title={canSave?'':'Confirma los valores inusuales antes de guardar'}
          >💾 Guardar</button>
        </div>

        {/* Anomaly warnings */}
        {anomalies.length > 0 && (
          <div style={{ background:'#fff7ed', border:'1px solid #fb923c', borderRadius:10, padding:14, marginBottom:14 }}>
            <div style={{ fontWeight:700, color:'#c2410c', marginBottom:8 }}>⚠️ Valores inusuales detectados en la venta de {dayLabel(prevDate)}</div>
            {anomalies.map(a => (
              <div key={a.key} style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6, padding:'8px 10px', background:'white', borderRadius:8, border:`1px solid ${anomalyOk[a.key]?'#86efac':'#fca5a5'}` }}>
                <input type="checkbox" checked={!!anomalyOk[a.key]} onChange={e=>setAnomalyOk(p=>({...p,[a.key]:e.target.checked}))} style={{ cursor:'pointer' }} />
                <span style={{ fontSize:13, flex:1 }}>
                  {a.setName && <strong style={{ color:SET_COLORS[a.setName] }}>{a.setName} </strong>}
                  <strong style={{ color:FUEL_COLORS[a.fuel] }}>{FUEL_ICONS[a.fuel]} {a.fuel}</strong>
                  {' — '}<span style={{ color:'#dc2626' }}>{fmtG(a.sale)}</span>{' · '}{a.reason}
                </span>
                {anomalyOk[a.key] && <span style={{ color:'#059669', fontSize:12, fontWeight:600 }}>✓ Confirmado</span>}
              </div>
            ))}
            {!canSave && <div style={{ fontSize:12, color:'#c2410c', marginTop:6 }}>Marca cada valor como correcto para poder guardar.</div>}
          </div>
        )}

        {/* Implied sales from yesterday */}
        {(() => {
          const sales = [];
          if (isJuta(st)) {
            for (const [sn,fuels] of Object.entries(JUTA_SETS)) for (const f of fuels) {
              const s = getSale(dailyLog,st,prevDate,f,sn);
              if (s!==null) sales.push(<span key={sn+f} style={{fontSize:13}}><strong style={{color:SET_COLORS[sn]}}>{sn}</strong> {FUEL_ICONS[f]} {f}: <strong>{fmtG(s)}</strong></span>);
            }
          } else {
            for (const f of FUELS) { const s=getSale(dailyLog,st,prevDate,f,null); if(s!==null) sales.push(<span key={f} style={{fontSize:13}}>{FUEL_ICONS[f]} {f}: <strong>{fmtG(s)}</strong></span>); }
          }
          if (!sales.length) return <div style={S.alert('info')}>ℹ️ Las ventas del {dayLabel(prevDate)} se calcularán cuando ambos días tengan niveles guardados.</div>;
          return (
            <div style={{ background:'#f0fdf4', borderRadius:10, padding:12, marginBottom:14, border:'1px solid #86efac' }}>
              <div style={{ fontWeight:700, color:'#065f46', marginBottom:8 }}>📊 Ventas del {dayLabel(prevDate)} (calculadas)</div>
              <div style={{ display:'flex', gap:16, flexWrap:'wrap' }}>{sales}</div>
            </div>
          );
        })()}

        {/* ── Morning Levels ── */}
        <div style={{ marginBottom:22 }}>
          <div style={{ fontWeight:700, color:'#1e3a5f', fontSize:14, marginBottom:12, paddingBottom:6, borderBottom:'2px solid #dbeafe' }}>🌅 Niveles de la Mañana</div>
          {isJuta(st) ? (
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }} className="g2">
              {Object.entries(JUTA_SETS).map(([setName, fuels]) => (
                <div key={setName} style={{ padding:14, background:'#f8fafc', borderRadius:10, borderLeft:`4px solid ${SET_COLORS[setName]}` }}>
                  <div style={{ fontWeight:700, color:SET_COLORS[setName], marginBottom:10 }}>🛢️ {setName}</div>
                  {fuels.map(fuel => {
                    const max = getMaxCap(config, st, fuel, setName);
                    const m   = draft.morning?.[setName]?.[fuel];
                    const mp  = getMinPct(config, setName);
                    const p   = m!==null && max>0 ? Math.round(m/max*100) : null;
                    const col = p!==null ? (p<mp*100?'#dc2626':p<WARN_PCT*100?'#d97706':'#059669') : '#94a3b8';
                    const anom = anomalies.find(a=>a.key===`${setName}_${fuel}`);
                    return (
                      <div key={fuel} style={{ marginBottom:8 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                          <span style={{ fontWeight:600, color:FUEL_COLORS[fuel], width:72, fontSize:13, flexShrink:0 }}>{FUEL_ICONS[fuel]} {fuel}</span>
                          <input style={{ ...S.inputSm, width:105, borderColor:anom&&!anomalyOk[anom.key]?'#dc2626':undefined }} type="number" min="0" max={max} value={m??''} onChange={e=>setMorning(fuel,setName,e.target.value)} placeholder="0 gal" />
                          <span style={{ fontSize:11, color:'#94a3b8', flexShrink:0 }}>/ {fmt(max)}</span>
                          {p!==null && <span style={{ fontSize:11, fontWeight:700, color:col, flexShrink:0 }}>{p}%</span>}
                        </div>
                        {anom && !anomalyOk[anom.key] && <div style={{ fontSize:11, color:'#dc2626', marginTop:2, marginLeft:82 }}>⚠️ {anom.reason}</div>}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          ) : (
            <div style={{ display:'flex', gap:14, flexWrap:'wrap' }}>
              {FUELS.map(fuel => {
                const max = getMaxCap(config, st, fuel, null);
                const m   = draft.morning?.[fuel];
                const mp  = getMinPct(config, null);
                const p   = m!==null && max>0 ? Math.round(m/max*100) : null;
                const col = p!==null ? (p<mp*100?'#dc2626':p<WARN_PCT*100?'#d97706':'#059669') : '#94a3b8';
                const anom = anomalies.find(a=>a.key===`null_${fuel}`);
                return (
                  <div key={fuel} style={{ padding:14, background:'#f8fafc', borderRadius:10, borderLeft:`4px solid ${FUEL_COLORS[fuel]}`, flex:'1 1 150px' }}>
                    <div style={{ fontWeight:700, color:FUEL_COLORS[fuel], marginBottom:8 }}>{FUEL_ICONS[fuel]} {fuel}</div>
                    <input style={{ ...S.inputSm, borderColor:anom&&!anomalyOk[anom.key]?'#dc2626':FUEL_COLORS[fuel] }} type="number" min="0" max={max} value={m??''} onChange={e=>setMorning(fuel,null,e.target.value)} placeholder="0 gal" />
                    <div style={{ fontSize:11, marginTop:4, display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'#94a3b8' }}>Máx: {fmt(max)}</span>
                      {p!==null && <span style={{ fontWeight:700, color:col }}>{p}%</span>}
                    </div>
                    {anom && !anomalyOk[anom.key] && <div style={{ fontSize:11, color:'#dc2626', marginTop:4 }}>⚠️ {anom.reason}</div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── Confirmed Sales (from POS/pumps) ── */}
        <details style={{ marginBottom:18 }}>
          <summary style={{ cursor:'pointer', fontSize:13, color:'#64748b', fontWeight:600, userSelect:'none', paddingBottom:8, borderBottom:'1px solid #f1f5f9' }}>
            🖥️ Venta confirmada desde bombas (opcional) — ayuda a detectar diferencias con el nivel de tanques
          </summary>
          <div style={{ marginTop:12 }}>
            {isJuta(st) ? (
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }} className="g2">
                {Object.entries(JUTA_SETS).map(([sn,fuels]) => (
                  <div key={sn} style={{ padding:12, background:'#f8fafc', borderRadius:8, borderLeft:`3px solid ${SET_COLORS[sn]}` }}>
                    <div style={{ fontWeight:700, color:SET_COLORS[sn], marginBottom:10, fontSize:13 }}>🛢️ {sn}</div>
                    {fuels.map(fuel => {
                      const v = draft.confirmedSale?.[sn]?.[fuel] ?? null;
                      const calc = getSale(dailyLog,st,prevDate,fuel,sn);
                      const diff = (v!==null && calc!==null) ? v - calc : null;
                      return (
                        <div key={fuel} style={{ marginBottom:10 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                            <span style={{ fontWeight:600, color:FUEL_COLORS[fuel], width:70, fontSize:12 }}>{FUEL_ICONS[fuel]} {fuel}</span>
                            <AccumInput value={v} onChange={val=>setConfirmedSale(fuel,sn,val)} style={{ ...S.inputSm, width:100 }} placeholder="0 gal" />
                          </div>
                          {diff!==null && <div style={{ fontSize:11, marginTop:2, marginLeft:78, color:Math.abs(diff)>200?'#dc2626':'#64748b' }}>
                            vs calc: {diff>0?'+':''}{fmt(diff)} gal{Math.abs(diff)>200?' ⚠️':''}
                          </div>}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
                {FUELS.map(fuel => {
                  const v = draft.confirmedSale?.[fuel] ?? null;
                  const calc = getSale(dailyLog,st,prevDate,fuel,null);
                  const diff = (v!==null && calc!==null) ? v - calc : null;
                  return (
                    <div key={fuel} style={{ flex:'1 1 140px' }}>
                      <label style={{ ...S.label, color:FUEL_COLORS[fuel] }}>{FUEL_ICONS[fuel]} {fuel} (desde bombas)</label>
                      <AccumInput value={v} onChange={val=>setConfirmedSale(fuel,null,val)} style={{ ...S.inputSm, borderColor:FUEL_COLORS[fuel] }} placeholder="0 gal" />
                      {diff!==null && <div style={{ fontSize:11, marginTop:2, color:Math.abs(diff)>200?'#dc2626':'#64748b' }}>
                        vs calc: {diff>0?'+':''}{fmt(diff)} gal{Math.abs(diff)>200?' ⚠️':''}
                      </div>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </details>

        {/* ── Descarga summary (read-only; managed in Cisternas tab) ── */}
        <div style={{ marginBottom:16 }}>
          <div style={{ fontWeight:700, color:'#1e3a5f', fontSize:14, marginBottom:12, paddingBottom:6, borderBottom:'2px solid #dbeafe', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span>🚛 Movimiento de Cisternas (hoy)</span>
            <span style={{ fontSize:11, fontWeight:400, color:'#94a3b8' }}>Se gestiona en la pestaña 🛢️ Cisternas</span>
          </div>
          {(hasDelivered || hasPending) ? (
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }} className="g2">
              <div style={{ background:hasDelivered?'#f0fdf4':'#f8fafc', borderRadius:10, padding:12, border:`1px solid ${hasDelivered?'#86efac':'#e2e8f0'}` }}>
                <div style={{ fontWeight:700, color:'#065f46', marginBottom:6, fontSize:12 }}>✅ Descargado en tanques hoy:</div>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap', fontSize:12 }}>
                  {hasDelivered ? Object.entries(deliveredToday).flatMap(([sn,fs])=>Object.entries(fs).map(([f,v])=>
                    <span key={sn+f}>{sn!=='_'&&<strong style={{color:SET_COLORS[sn]}}>{sn} </strong>}{FUEL_ICONS[f]}: <strong>{fmtG(v)}</strong></span>
                  )) : <span style={{ color:'#94a3b8' }}>Nada descargado</span>}
                </div>
              </div>
              <div style={{ background:hasPending?'#fffbeb':'#f8fafc', borderRadius:10, padding:12, border:`1px solid ${hasPending?'#fcd34d':'#e2e8f0'}` }}>
                <div style={{ fontWeight:700, color:'#92400e', marginBottom:6, fontSize:12 }}>⏳ En cisternas, pendiente por descargar:</div>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap', fontSize:12 }}>
                  {hasPending ? Object.entries(pendingTrucks).flatMap(([sn,fs])=>Object.entries(fs).map(([f,v])=>
                    <span key={sn+f}>{sn!=='_'&&<strong style={{color:SET_COLORS[sn]}}>{sn} </strong>}{FUEL_ICONS[f]}: <strong>{fmtG(v)}</strong></span>
                  )) : <span style={{ color:'#94a3b8' }}>Nada pendiente</span>}
                </div>
              </div>
            </div>
          ) : (
            <div style={S.alert('info')}>ℹ️ No hay cisternas registradas para hoy. Agrégalas y marca compartimentos en la pestaña 🛢️ Cisternas.</div>
          )}
        </div>

        {/* Notes */}
        <div>
          <label style={S.label}>Notas</label>
          <input style={S.input} type="text" value={draft.notes||''} onChange={e=>setDraft(p=>({...p,notes:e.target.value}))} placeholder="Observaciones del día..." />
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// CISTERNAS TAB — track trucks & per-compartment offload status
// ═══════════════════════════════════════════════════════════
// Truck card — module-scoped so its identity is stable across renders
// (a nested component would remount each keystroke, dropping focus & scrolling).
function CisternaTruckCard({ a, st, isJ, setOpts, fuelOpts, fitOf, setComp, delTruck, updateArrival }) {
  const total = a.comps.reduce((t,c)=>t+(c.vol||0),0);
  const deliveredCount = a.comps.filter(c=>c.status==='delivered').length;
  const allDone = deliveredCount === a.comps.length;
  return (
    <div style={{ border:`2px solid ${allDone?'#86efac':'#fcd34d'}`, borderRadius:12, padding:14, marginBottom:14, background:'white' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:10, flexWrap:'wrap' }}>
        <div style={{ fontWeight:700, fontSize:15, color:'#1e3a5f' }}>🚛 Cisterna {a.cistId}</div>
        <div style={{ fontSize:12, color:'#64748b' }}>Llegó: <strong>{dayLabel(a.arrivalDate)}</strong></div>
        <div style={{ fontSize:12, fontWeight:700, color:allDone?'#059669':'#d97706' }}>
          {allDone ? '✅ Completa' : `⏳ ${deliveredCount}/${a.comps.length} descargados`}
        </div>
        <div style={{ fontSize:12, color:'#64748b' }}>{fmtG(total)}</div>
        <button onClick={()=>delTruck(a.id)} style={{ ...S.btn, background:'#fee2e2', color:'#dc2626', padding:'4px 10px', fontSize:12, marginLeft:'auto' }}>🗑️ Eliminar</button>
      </div>

      {/* compartment chips */}
      <div style={{ display:'flex', gap:4, marginBottom:12, flexWrap:'wrap' }}>
        {a.comps.map((c,i) => {
          const f = c.status==='delivered'?c.actualFuel:c.plannedFuel;
          const bg = f ? FUEL_COLORS[f] : '#cbd5e1';
          return (
            <div key={i} title={`C${i+1}: ${fmtG(c.vol)}`} style={{ flex:c.vol, minWidth:40, background:bg, opacity:c.status==='delivered'?1:0.45, borderRadius:6, padding:'4px 2px', textAlign:'center', color:'white', fontSize:10, fontWeight:700, border:c.status==='delivered'?'2px solid #065f46':'2px dashed #92400e' }}>
              C{i+1}<div style={{ fontSize:9 }}>{c.vol>=1000?`${c.vol/1000}k`:c.vol}</div>
            </div>
          );
        })}
      </div>

      <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', minWidth:isJ?820:640 }}>
          <thead><tr>
            <th style={S.th}>Comp.</th><th style={S.th}>Vol.</th><th style={S.th}>Estado</th>
            {isJ && <th style={S.th}>Set plan.</th>}<th style={S.th}>Comb. plan.</th>
            {isJ && <th style={S.th}>Set real</th>}<th style={S.th}>Comb. real</th>
            <th style={S.th}>Fecha desc.</th><th style={S.th}>Hora desc.</th><th style={S.th}>¿Cabe?</th>
          </tr></thead>
          <tbody>
            {a.comps.map((c,idx) => {
              const isPending = c.status==='pending';
              const cap = fitOf(a.id, idx);
              return (
                <tr key={idx} className="row-hover" style={{ background: cap&&!cap.fits?'#fff5f5':isPending?'#fffbeb':'white' }}>
                  <td style={{ ...S.td, fontWeight:700, color:'#1e3a5f' }}>C{idx+1}</td>
                  <td style={{ ...S.td, fontWeight:700 }}>{fmt(c.vol)}</td>
                  <td style={S.td}>
                    <div style={{ display:'flex', gap:4 }}>
                      {['delivered','pending'].map(stt => (
                        <button key={stt} onClick={()=>setComp(a.id,idx,{status:stt})}
                          style={{ padding:'3px 8px', borderRadius:6, border:'none', cursor:'pointer', fontSize:11, fontWeight:700,
                            background:c.status===stt?(stt==='delivered'?'#059669':'#d97706'):'#f1f5f9', color:c.status===stt?'white':'#64748b' }}>
                          {stt==='delivered'?'✓ Desc.':'⏳ Pend.'}
                        </button>
                      ))}
                    </div>
                  </td>
                  {isJ && (
                    <td style={S.td}>
                      <select style={{ ...S.inputSm, borderColor:c.plannedSet?SET_COLORS[c.plannedSet]:'#d1d5db', minWidth:72 }} value={c.plannedSet} onChange={e=>setComp(a.id,idx,{plannedSet:e.target.value})}>
                        <option value="">— —</option>{setOpts.map(s=><option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                  )}
                  <td style={S.td}>
                    <select style={{ ...S.inputSm, borderColor:c.plannedFuel?FUEL_COLORS[c.plannedFuel]:'#d1d5db', minWidth:84 }} value={c.plannedFuel} onChange={e=>setComp(a.id,idx,{plannedFuel:e.target.value})}>
                      <option value="">— —</option>{fuelOpts(c.plannedSet).map(f=><option key={f} value={f}>{FUEL_ICONS[f]} {f}</option>)}
                    </select>
                  </td>
                  {isJ && (
                    <td style={{ ...S.td, opacity:isPending?0.35:1 }}>
                      <select style={{ ...S.inputSm, borderColor:c.actualSet?SET_COLORS[c.actualSet]:'#d1d5db', minWidth:72 }} value={c.actualSet} disabled={isPending} onChange={e=>setComp(a.id,idx,{actualSet:e.target.value})}>
                        <option value="">— —</option>{setOpts.map(s=><option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                  )}
                  <td style={{ ...S.td, opacity:isPending?0.35:1 }}>
                    <select style={{ ...S.inputSm, borderColor:c.actualFuel?FUEL_COLORS[c.actualFuel]:'#d1d5db', minWidth:84 }} value={c.actualFuel} disabled={isPending} onChange={e=>setComp(a.id,idx,{actualFuel:e.target.value})}>
                      <option value="">— —</option>{fuelOpts(c.actualSet).map(f=><option key={f} value={f}>{FUEL_ICONS[f]} {f}</option>)}
                    </select>
                  </td>
                  <td style={{ ...S.td, opacity:isPending?0.35:1 }}>
                    <input type="date" style={{ ...S.inputSm, minWidth:128 }} value={c.deliveredDate||''} disabled={isPending} onChange={e=>setComp(a.id,idx,{deliveredDate:e.target.value})} />
                  </td>
                  <td style={{ ...S.td, opacity:isPending?0.35:1 }}>
                    <input type="time" style={{ ...S.inputSm, minWidth:96 }} value={c.deliveredTime||''} disabled={isPending} onChange={e=>setComp(a.id,idx,{deliveredTime:e.target.value})} placeholder="--:--" />
                  </td>
                  <td style={{ ...S.td, minWidth:104 }}>
                    {cap ? (
                      <div><span style={{ fontWeight:700 }}>{cap.fits?'✅':'❌'}</span>
                        <div style={{ fontSize:10, color:cap.fits?'#059669':'#dc2626' }}>{cap.fits?'Cabe':'¡No cabe!'} · {fmt(cap.space)} libre</div>
                        {cap.timed && <div style={{ fontSize:10, color:'#0369a1' }}>~{fmt(cap.sold)} vendidos a esa hora</div>}
                      </div>
                    ) : <span style={{ fontSize:11, color:'#cbd5e1' }}>—</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ marginTop:8 }}>
        <input style={{ ...S.inputSm }} type="text" placeholder="Notas de esta cisterna…" value={a.notes||''} onChange={e=>updateArrival(a.id, x=>{x.notes=e.target.value;return x;})} />
      </div>
    </div>
  );
}

function CisternasTab({ config, dailyLog, cisternas, arrivals, setArrivals }) {
  const [st, setSt] = useState('Puma Juticalpa');
  const [newCist, setNewCist] = useState('');
  const [newDate, setNewDate] = useState(getTodayStr());
  const isJ = isJuta(st);

  const cistList = Object.keys(cisternas);
  const list = (arrivals[st] || []).slice().sort((a,b) => a.arrivalDate < b.arrivalDate ? 1 : -1);

  function addTruck() {
    if (!newCist) { alert('Selecciona una cisterna.'); return; }
    const vols = cisternas[newCist] || [];
    const comps = vols.map(v => ({ vol:v, plannedSet:'', plannedFuel:'', actualSet:'', actualFuel:'', status:'pending', deliveredDate:null, deliveredTime:'' }));
    setArrivals(p => ({ ...p, [st]: [ ...(p[st]||[]), { id:makeArrivalId(), cistId:newCist, arrivalDate:newDate, comps, notes:'' } ] }));
  }
  function updateArrival(id, fn) {
    setArrivals(p => ({ ...p, [st]: (p[st]||[]).map(a => a.id===id ? fn(JSON.parse(JSON.stringify(a))) : a) }));
  }
  function delTruck(id) {
    if (!window.confirm('¿Eliminar esta cisterna del registro? (no se puede deshacer)')) return;
    setArrivals(p => ({ ...p, [st]: (p[st]||[]).filter(a => a.id!==id) }));
  }
  function setComp(id, idx, patch) {
    updateArrival(id, a => {
      const c = a.comps[idx];
      Object.assign(c, patch);
      if (isJuta(st)) {
        if (c.plannedFuel==='Regular') c.plannedSet = 'Set 1';
        if (c.actualFuel==='Regular')  c.actualSet  = 'Set 1';
      }
      // While pending, the actual mirrors the plan and there's no delivery date/time
      if (c.status==='pending') { c.actualFuel = c.plannedFuel; c.actualSet = c.plannedSet; c.deliveredDate = null; c.deliveredTime = ''; }
      // On marking delivered, default actual to plan and date to the truck's arrival day
      if (patch.status==='delivered') {
        if (!c.actualFuel) { c.actualFuel = c.plannedFuel; c.actualSet = c.plannedSet; }
        if (!c.deliveredDate) c.deliveredDate = a.arrivalDate || getTodayStr();
      }
      return a;
    });
  }

  // Fit check: space in the target tank at the descarga time.
  // Morning level (~6:30 AM) minus estimated sales by that hour = level when the truck unloads.
  function fitOf(arrivalId, idx) {
    if (isSupplyOnly(st)) return null;
    const arr = list.find(a => a.id===arrivalId); if (!arr) return null;
    const c = arr.comps[idx];
    const fuel = c.status==='delivered' ? c.actualFuel : c.plannedFuel;
    const setN = c.status==='delivered' ? c.actualSet  : c.plannedSet;
    if (!fuel || (isJuta(st) && !setN)) return null;
    const max = getMaxCap(config, st, fuel, isJuta(st)?setN:null);
    if (max === 0) return { fits:true, space:Infinity };
    const refDate = c.deliveredDate || arr.arrivalDate || getTodayStr();
    const morning = getMorning(dailyLog, st, refDate, fuel, isJuta(st)?setN:null) ?? 0;
    // estimated sales already gone by the descarga time (only when a time is given)
    const dayForecast = getForecast(dailyLog, st, refDate, fuel, isJuta(st)?setN:null, null) ?? 0;
    const sold = c.deliveredTime ? estSoldByTime(dayForecast, c.deliveredTime) : 0;
    // other delivered comps into the same tank on the same date
    let already = 0;
    for (const a of (arrivals[st]||[])) for (let j=0;j<a.comps.length;j++) {
      if (a.id===arrivalId && j===idx) continue;
      const oc = a.comps[j];
      if (oc.status!=='delivered' || oc.deliveredDate!==refDate) continue;
      if (oc.actualFuel!==fuel) continue;
      if (isJuta(st) && oc.actualSet!==setN) continue;
      already += oc.vol||0;
    }
    const levelBefore = Math.max(0, morning - sold) + already;
    const space = Math.max(0, max - levelBefore);
    return { fits:(c.vol||0)<=space, space, sold:Math.round(sold), timed: !!c.deliveredTime };
  }

  // Global pending summary across all stations
  const globalPending = STATIONS.map(s => {
    const trucks = (arrivals[s]||[]).filter(a => a.comps.some(c => c.status==='pending'));
    const gal = (arrivals[s]||[]).reduce((t,a)=>t+a.comps.filter(c=>c.status==='pending').reduce((x,c)=>x+(c.vol||0),0),0);
    return { s, trucks: trucks.length, gal };
  }).filter(x => x.trucks>0);

  const pendingTrucks = list.filter(a => a.comps.some(c => c.status==='pending'));
  const doneTrucks    = list.filter(a => a.comps.every(c => c.status==='delivered'));

  const setOpts = isJ ? Object.keys(JUTA_SETS) : [];
  const fuelOpts = (setName) => isJ && setName ? (JUTA_SETS[setName]||FUELS) : FUELS;
  const cardProps = { st, isJ, setOpts, fuelOpts, fitOf, setComp, delTruck, updateArrival };

  return (
    <div>
      <div style={S.stBar}>
        {STATIONS.map(s => <button key={s} style={S.stBtn(st===s,STATION_COLORS[s])} onClick={()=>setSt(s)}>{s}{isSupplyOnly(s)?' 📦':''}</button>)}
      </div>

      {/* Global pending banner */}
      {globalPending.length>0 && (
        <div style={S.alert('warn')}>
          ⏳ <strong>Cisternas pendientes por descargar:</strong>{' '}
          {globalPending.map((g,i)=><span key={g.s}>{i>0?' · ':''}{g.s}: <strong>{g.trucks}</strong> ({fmtG(g.gal)})</span>)}
        </div>
      )}

      {/* Add truck */}
      <div style={S.card}>
        <div style={S.title}>➕ Registrar Cisterna que Llegó — {st}</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 180px auto', gap:12, alignItems:'end' }} className="g3">
          <div>
            <label style={S.label}>Cisterna</label>
            <select style={S.input} value={newCist} onChange={e=>setNewCist(e.target.value)}>
              <option value="">— Selecciona —</option>
              {cistList.map(id=><option key={id} value={id}>Cisterna {id} — {(cisternas[id]||[]).length} comp · {(cisternas[id]||[]).reduce((a,b)=>a+b,0).toLocaleString()} gal</option>)}
            </select>
          </div>
          <div>
            <label style={S.label}>Fecha de llegada</label>
            <input style={S.input} type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} />
          </div>
          <button style={{ ...S.btn, background:'#1e3a5f', color:'white' }} onClick={addTruck}>+ Agregar Cisterna</button>
        </div>
        <div style={{ fontSize:12, color:'#64748b', marginTop:8 }}>
          ℹ️ Cada compartimento empieza como <strong>⏳ Pendiente</strong>. Márcalo <strong>✓ Descargado</strong> con su fecha y <strong>hora</strong> real cuando entre al tanque — puede ser otro día. La hora ajusta el espacio disponible según las ventas estimadas hasta ese momento (los niveles se miden a las ~6:30 AM).
        </div>
      </div>

      {/* Pending trucks */}
      <div style={S.card}>
        <div style={S.title}>⏳ Cisternas Pendientes ({pendingTrucks.length})</div>
        {pendingTrucks.length===0
          ? <div style={{ fontSize:13, color:'#94a3b8' }}>No hay cisternas pendientes en {st}.</div>
          : pendingTrucks.map(a => <CisternaTruckCard key={a.id} a={a} {...cardProps} />)}
      </div>

      {/* Completed trucks */}
      <div style={S.card}>
        <div style={S.title}>✅ Cisternas Completadas ({doneTrucks.length})</div>
        {doneTrucks.length===0
          ? <div style={{ fontSize:13, color:'#94a3b8' }}>Aún no hay cisternas completamente descargadas en {st}.</div>
          : doneTrucks.map(a => <CisternaTruckCard key={a.id} a={a} {...cardProps} />)}
      </div>
    </div>
  );
}

// FORECAST TAB — 3-day outlook + sales history

function ForecastTab({ config, dailyLog, arrivals }) {
  const forecastStations = STATIONS.filter(s => !isSupplyOnly(s));
  const [st, setSt]       = useState('Puma Juticalpa');
  const [today]           = useState(getTodayStr());
  const [overrides, setOv] = useState({});
  const [orders, setOrders] = useState({});  // { '<set>_<fuel>': { o1, o2 } }

  function setOverride(date, fuel, val) {
    setOv(p => {
      const n = JSON.parse(JSON.stringify(p));
      if (!n[date]) n[date] = {};
      n[date][fuel] = val===''?null:+val;
      return n;
    });
  }
  function setOrder(key, which, val) {
    setOrders(p => ({ ...p, [key]: { ...(p[key]||{}), [which]: val==='' ? null : +val } }));
  }

  const days     = [today, addDays(today,1), addDays(today,2)];
  const dayDescs = ['Día 1 – HOY (pedido antes de 12pm)', 'Día 2 – Carga del camión', 'Día 3 – Llegada estimada'];

  const invKeys = isJuta(st)
    ? Object.entries(JUTA_SETS).flatMap(([sn,fuels]) => fuels.map(f=>({set:sn,fuel:f})))
    : FUELS.map(f=>({set:null,fuel:f}));

  return (
    <div>
      <div style={S.stBar}>
        {forecastStations.map(s => <button key={s} style={S.stBtn(st===s,STATION_COLORS[s])} onClick={()=>setSt(s)}>{s}</button>)}
      </div>

      <div style={S.alert('info')}>
        📌 <strong>Lógica de pedido:</strong> Día 1 = hoy (orden antes del mediodía). Camión carga Día 2 y llega tarde del Día 2 o mañana del Día 3.
      </div>

      {invKeys.map(({ set: setName, fuel }) => {
        const max        = getMaxCap(config, st, fuel, setName);
        const mp         = getMinPct(config, setName);
        const ip         = getIdealPct(config, setName);
        const minLevel   = max * mp;
        const idealLevel = max * ip;
        const col        = FUEL_COLORS[fuel];

        // Level breakdown for Day 1 (from arrivals = source of truth)
        const morning     = getMorning(dailyLog, st, today, fuel, setName) ?? 0;
        const descToday   = getDescarga(dailyLog, st, today, fuel, setName);
        const pendTotal   = pendingNow(arrivals, st, fuel, setName, today);                 // all pending in trucks now
        const pendingYest = pendingNow(arrivals, st, fuel, setName, addDays(today,-1));      // arrived a prior day
        const cistPlanned = descToday + Math.max(0, pendTotal - pendingYest);               // arrived/handled today
        const effectiveD1 = morning + descToday + pendTotal;

        // Forecasts (4 days so we can model Day-2's order landing on Day 4)
        const forecasts = days.map(d => getForecast(dailyLog, st, d, fuel, setName, overrides[d]?.[fuel]??null));
        const f3 = getForecast(dailyLog, st, addDays(today,3), fuel, setName, overrides[addDays(today,3)]?.[fuel]??null) ?? 0;

        // Projections (no order)
        const atDay1End  = Math.max(0, effectiveD1 - (forecasts[0]??0));
        const atDay3Morn = Math.max(0, effectiveD1  - (forecasts[0]??0) - (forecasts[1]??0));
        const afterOrder = atDay3Morn + Math.max(0, idealLevel - atDay3Morn);
        const atDay3End  = Math.max(0, afterOrder - (forecasts[2]??0));

        const orderMin   = Math.max(0, Math.round(idealLevel - atDay3Morn));
        const orderMax   = Math.max(0, Math.round(max       - atDay3Morn));
        const urgent     = atDay3Morn < minLevel && max > 0;
        const warn       = atDay3Morn < max * WARN_PCT && !urgent && max > 0;

        // ── Multi-day order plan (daily ordering): order1 placed D1 arrives D3, order2 placed D2 arrives D4 ──
        const okey   = (setName||'') + '_' + fuel;
        const o1def  = orderMin;
        const startD3def = atDay3Morn + o1def;
        const endD3def   = Math.max(0, startD3def - (forecasts[2]??0));
        const o2def  = Math.max(0, Math.round(idealLevel - endD3def));
        const o1 = orders[okey]?.o1 ?? o1def;
        const o2 = orders[okey]?.o2 ?? o2def;
        const startD3 = atDay3Morn + o1;
        const endD3   = Math.max(0, startD3 - (forecasts[2]??0));
        const startD4 = endD3 + o2;
        const endD4   = Math.max(0, startD4 - f3);
        const d3Low = endD3 < minLevel && max > 0;
        const d4Low = endD4 < minLevel && max > 0;
        const d3Over = startD3 > max && max > 0;
        const d4Over = startD4 > max && max > 0;

        // Historical same-weekday data (for context in the table)
        const hist = days.map(d => {
          const dMinus7  = addDays(d, -7);
          const dMinus14 = addDays(d, -14);
          return {
            calc1: getSale(dailyLog, st, dMinus7,  fuel, setName),
            calc2: getSale(dailyLog, st, dMinus14, fuel, setName),
            conf1: getConfirmedSale(dailyLog, st, dMinus7,  fuel, setName),
            conf2: getConfirmedSale(dailyLog, st, dMinus14, fuel, setName),
          };
        });

        return (
          <div key={(setName||'')+fuel} style={S.card}>
            {/* Card header */}
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14, flexWrap:'wrap' }}>
              {setName && <span style={{ background:SET_COLORS[setName], color:'white', padding:'3px 10px', borderRadius:12, fontSize:12, fontWeight:700 }}>{setName}</span>}
              <span style={{ fontWeight:700, fontSize:16, color:col }}>{FUEL_ICONS[fuel]} {fuel}</span>
              <span style={{ fontSize:11, color:'#64748b', marginLeft:'auto' }}>
                Máx: {fmt(max)} · Mín ({Math.round(mp*100)}%): {fmt(minLevel)} · Ideal ({Math.round(ip*100)}%): {fmt(idealLevel)} gal
              </span>
            </div>

            {urgent && <div style={S.alert('danger')}>🚨 Nivel proyectado al llegar el camión ({fmtG(atDay3Morn)}) está BAJO el mínimo ({fmtG(minLevel)}). Pedido URGENTE.</div>}
            {warn   && <div style={S.alert('warn')}>⚠️ Nivel al llegar el camión ({fmtG(atDay3Morn)}) entre mínimo y {Math.round(WARN_PCT*100)}%.</div>}

            <LevelBar level={morning} max={max} color={col} minPct={mp} idealPct={ip} />

            <div style={{ overflowX:'auto', marginTop:14 }}>
              <table style={{ width:'100%', borderCollapse:'collapse', minWidth:520 }}>
                <thead>
                  <tr>
                    <th style={{ ...S.th, textAlign:'left', minWidth:210 }}>Concepto</th>
                    {days.map((d,i) => (
                      <th key={d} style={S.th}>
                        <div>{dayLabel(d)}</div>
                        <div style={{ fontSize:10, fontWeight:400, color:'#94a3b8' }}>{dayDescs[i]}</div>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {/* ── Level breakdown rows (Day 1 only has actual data) ── */}
                  <tr style={{ background:'#f0f9ff' }}>
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600, color:'#0369a1' }}>🌅 Nivel de la mañana</td>
                    <td style={{ ...S.td, fontWeight:700 }}>{morning>0?fmt(morning):'—'}</td>
                    <td style={{ ...S.td, color:'#cbd5e1' }}>—</td>
                    <td style={{ ...S.td, color:'#cbd5e1' }}>—</td>
                  </tr>
                  <tr style={{ background:'#fffbeb' }}>
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600, color:'#92400e' }}>⏳ Pendiente (de otro día)</td>
                    <td style={{ ...S.td, fontWeight:pendingYest>0?700:400, color:pendingYest>0?'#d97706':'#cbd5e1' }}>{pendingYest>0?fmt(pendingYest):'—'}</td>
                    <td style={{ ...S.td, color:'#cbd5e1' }}>—</td>
                    <td style={{ ...S.td, color:'#cbd5e1' }}>—</td>
                  </tr>
                  <tr style={{ background:'#f0fdf4' }}>
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600, color:'#065f46' }}>🚛 Cisterna planeada hoy</td>
                    <td style={{ ...S.td, fontWeight:cistPlanned>0?700:400, color:cistPlanned>0?'#059669':'#cbd5e1' }}>{cistPlanned>0?fmt(cistPlanned):'—'}</td>
                    <td style={{ ...S.td, color:'#cbd5e1' }}>—</td>
                    <td style={{ ...S.td, color:'#cbd5e1' }}>—</td>
                  </tr>

                  {/* ── Historical reference rows ── */}
                  <tr style={{ background:'#faf5ff' }}>
                    <td style={{ ...S.td, textAlign:'left', color:'#6d28d9', fontSize:12 }}>
                      📊 Venta hace 1 sem (calc / confirmada)
                    </td>
                    {hist.map((h,i) => (
                      <td key={i} style={{ ...S.td, fontSize:12 }}>
                        {h.calc1!==null ? (
                          <div>
                            <span style={{ color:'#475569' }}>{fmt(h.calc1)}</span>
                            {h.conf1!==null && (
                              <span style={{ color:Math.abs(h.conf1-h.calc1)>200?'#dc2626':'#059669', marginLeft:4 }}>
                                / <strong>{fmt(h.conf1)}</strong>
                              </span>
                            )}
                          </div>
                        ) : <span style={{ color:'#cbd5e1' }}>—</span>}
                      </td>
                    ))}
                  </tr>
                  <tr style={{ background:'#faf5ff' }}>
                    <td style={{ ...S.td, textAlign:'left', color:'#6d28d9', fontSize:12 }}>
                      📊 Venta hace 2 sem (calc / confirmada)
                    </td>
                    {hist.map((h,i) => (
                      <td key={i} style={{ ...S.td, fontSize:12 }}>
                        {h.calc2!==null ? (
                          <div>
                            <span style={{ color:'#475569' }}>{fmt(h.calc2)}</span>
                            {h.conf2!==null && (
                              <span style={{ color:Math.abs(h.conf2-h.calc2)>200?'#dc2626':'#059669', marginLeft:4 }}>
                                / <strong>{fmt(h.conf2)}</strong>
                              </span>
                            )}
                          </div>
                        ) : <span style={{ color:'#cbd5e1' }}>—</span>}
                      </td>
                    ))}
                  </tr>

                  {/* ── Forecast rows ── */}
                  <tr>
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600 }}>
                      Venta estimada (gal) <span style={{ fontSize:10, color:'#94a3b8' }}>(editable)</span>
                    </td>
                    {forecasts.map((f,i) => {
                      const d = days[i];
                      const ov = overrides[d]?.[fuel];
                      return (
                        <td key={d} style={S.td}>
                          <input type="number" min="0"
                            value={ov!==undefined&&ov!==null ? ov : Math.round(f??0)}
                            onChange={e=>setOverride(d,fuel,e.target.value)}
                            style={{ width:80, textAlign:'center', fontSize:13, padding:'5px 6px',
                              border:`1px solid ${ov!=null?col:'#e2e8f0'}`, borderRadius:6,
                              background:ov!=null?`${col}15`:'white' }} />
                          {f===null && <div style={{ fontSize:10, color:'#94a3b8' }}>Sin histórico</div>}

                      );
                    })}
                  </tr>
                  <tr style={{ background:'#f8fafc' }}>
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600 }}>Nivel inicio del día (gal)</td>
                    <td style={{ ...S.td, fontWeight:700 }}>{fmt(effectiveD1)}</td>
                    <td style={{ ...S.td, color:'#64748b' }}>{fmt(atDay1End)}</td>
                    <td style={{ ...S.td, color:urgent?'#dc2626':warn?'#d97706':'#1e293b', fontWeight:urgent||warn?700:400 }}>
                      {fmt(atDay3Morn)} ← al llegar

                  <tr>
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600 }}>% Capacidad</td>
                    <td style={S.td}>{pct(effectiveD1,max)}%</td>
