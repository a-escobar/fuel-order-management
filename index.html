                  return (
                    <div key={d} style={{ textAlign:'center', minWidth:64 }}>
                      <div style={{ fontSize:10, color:'#94a3b8', marginBottom:2 }}>{dayLabel(d)}</div>
                      <div style={{ padding:'5px 4px', background:calc===null?'#f1f5f9':calc>0?`${col}15`:'#f1f5f9', borderRadius:6, fontSize:12, fontWeight:600, color:calc===null?'#cbd5e1':col, border:`1px solid ${calc===null?'#e2e8f0':col+'40'}`, minWidth:60 }}>
                        {calc===null?'—':fmt(calc)}
                        {hasConf && <div style={{ fontSize:10, color:bigDiff?'#dc2626':'#059669', fontWeight:700, marginTop:1 }}>
                          ✓{fmt(conf)}{bigDiff?'⚠️':''}
                        </div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// ORDER TAB — plan the order with compartment allocation
// ═══════════════════════════════════════════════════════════
function OrderTab({ config, dailyLog, cisternas, orderGroups, nextCisterna }) {
  const [groupIdx, setGroupIdx]   = useState(0);
  const [selCist,  setSelCist]    = useState('');
  const [activeStations, setActiveSt] = useState([]);
  const [compAssign, setCompAssign]   = useState({});
  const [optimized, setOptimized]     = useState(false);
  const [overrides, setOv]            = useState({});
  const [today] = useState(getTodayStr());

  const group = orderGroups[groupIdx];

  useEffect(() => {
    if (!group) return;
    // Prefer the nextCisterna set for the first station in this group (if it belongs to this group's cisternas)
    const firstSt = group.stations[0];
    const preferred = nextCisterna?.[firstSt];
    const defCist = (preferred && group.cisternas.includes(preferred))
      ? preferred
      : (group.cisternas[0]||'');
    setActiveSt([...group.stations]);
    setSelCist(defCist);
    setCompAssign({}); setOptimized(false);
  }, [groupIdx]);
  useEffect(() => { setCompAssign({}); setOptimized(false); }, [selCist]);

  const comps = cisternas[selCist] || [];
  const totalCist = comps.reduce((a,b)=>a+b,0);

  // Build targets and available space per station per (set/)fuel
  const { targets, maxSpace, recOrders } = useMemo(() => {
    const targets = {}, maxSpace = {}, recOrders = {};
    for (const station of activeStations) {
      targets[station]   = {};
      maxSpace[station]  = {};
      recOrders[station] = {};

      // ── Supply-only: target = what they requested today ──
      if (isSupplyOnly(station)) {
        const requested = dailyLog[station]?.[today]?.requested || {};
        for (const fuel of FUELS) {
          const amt = requested[fuel] ?? 0;
          targets[station][fuel]  = amt;
          maxSpace[station][fuel] = amt;
          recOrders[station][fuel] = { order:amt, orderMin:amt, orderMax:amt, atDel:null, ideal:null, min:null, max:null, space:amt, isSupplyOnly:true };
        }
        continue;
      }

      if (isJuta(station)) {
        for (const [sn, fuels] of Object.entries(JUTA_SETS)) {
          if (!targets[station][sn]) { targets[station][sn]={}; maxSpace[station][sn]={}; recOrders[station][sn]={}; }
          for (const fuel of fuels) {
            const max      = getMaxCap(config, station, fuel, sn);
            const ip       = getIdealPct(config, sn);
            const mp       = getMinPct(config, sn);
            const ideal    = max * ip;
            const min      = max * mp;
            const f1       = getForecast(dailyLog, station, today,            fuel, sn, overrides[today]?.[fuel]) ?? 0;
            const f2       = getForecast(dailyLog, station, addDays(today,1), fuel, sn, overrides[addDays(today,1)]?.[fuel]) ?? 0;
            const pend     = getPendingDescarga(dailyLog, station, addDays(today,-1), fuel, sn) + getPendingDescarga(dailyLog, station, today, fuel, sn);
            const atDel    = Math.max(0, (getMorning(dailyLog,station,today,fuel,sn)??0) + getDescarga(dailyLog,station,today,fuel,sn) + pend - f1 - f2);
            const orderMin = Math.max(0, Math.round(ideal - atDel));
            const orderMax = Math.max(0, Math.round(max   - atDel));
            const space    = orderMax;
            targets[station][sn][fuel]  = orderMin;
            maxSpace[station][sn][fuel] = space;
            recOrders[station][sn][fuel] = { order:orderMin, orderMin, orderMax, atDel, ideal, min, max, space };
          }
        }
      } else {
        for (const fuel of FUELS) {
          const max      = getMaxCap(config, station, fuel, null);
          const ip       = getIdealPct(config, null);
          const mp       = getMinPct(config, null);
          const ideal    = max * ip;
          const min      = max * mp;
          const f1       = getForecast(dailyLog, station, today,            fuel, null, overrides[today]?.[fuel]) ?? 0;
          const f2       = getForecast(dailyLog, station, addDays(today,1), fuel, null, overrides[addDays(today,1)]?.[fuel]) ?? 0;
          const pend     = getPendingDescarga(dailyLog, station, addDays(today,-1), fuel, null) + getPendingDescarga(dailyLog, station, today, fuel, null);
          const atDel    = Math.max(0, (getMorning(dailyLog,station,today,fuel,null)??0) + getDescarga(dailyLog,station,today,fuel,null) + pend - f1 - f2);
          const orderMin = Math.max(0, Math.round(ideal - atDel));
          const orderMax = Math.max(0, Math.round(max   - atDel));
          const space    = orderMax;
          targets[station][fuel]  = orderMin;
          maxSpace[station][fuel] = space;
          recOrders[station][fuel] = { order:orderMin, orderMin, orderMax, atDel, ideal, min, max, space };
        }
      }
    }
    return { targets, maxSpace, recOrders };
  }, [activeStations, config, dailyLog, today, overrides]);

  const totalRec = useMemo(() => {
    let t = 0;
    for (const st of activeStations) {
      if (isJuta(st)) { for (const sn of Object.keys(JUTA_SETS)) for (const f of JUTA_SETS[sn]) t += recOrders[st]?.[sn]?.[f]?.order ?? 0; }
      else { for (const f of FUELS) t += recOrders[st]?.[f]?.order ?? 0; }
    }
    return t;
  }, [recOrders, activeStations]);

  function toggleStation(s) {
    setActiveSt(p => p.includes(s) ? (p.length>1?p.filter(x=>x!==s):p) : [...p,s]);
    setCompAssign({}); setOptimized(false);
  }

  function assignComp(idx, station, setName, fuel) {
    if (!station||!fuel) { setCompAssign(p=>{ const n={...p}; delete n[idx]; return n; }); return; }
    setCompAssign(p => ({ ...p, [idx]:{ station, set:setName, fuel } }));
    setOptimized(false);
  }
  function clearComp(idx) { setCompAssign(p=>{ const n={...p}; delete n[idx]; return n; }); setOptimized(false); }

  function runOptimize() {
    const fa = autoOptimize(comps, activeStations, targets, maxSpace);
    const newAssign = {};
    (fa||[]).forEach((v,i) => { if (v) newAssign[i]=v; });
    setCompAssign(newAssign); setOptimized(true);
  }

  // Summarize actual order from compartment assignment
  const actualOrder = useMemo(() => {
    const r = {};
    for (const st of activeStations) {
      r[st] = isJuta(st)
        ? Object.fromEntries(Object.keys(JUTA_SETS).map(sn=>[sn, Object.fromEntries(JUTA_SETS[sn].map(f=>[f,0]))]))
        : Object.fromEntries(FUELS.map(f=>[f,0]));
    }
    for (const [idx, val] of Object.entries(compAssign)) {
      if (!val) continue;
      const { station:st, set:sn, fuel } = val;
      if (!r[st]) continue;
      if (isJuta(st) && sn) r[st][sn][fuel] = (r[st][sn][fuel]||0) + comps[parseInt(idx)];
      else if (!isJuta(st)) r[st][fuel] = (r[st][fuel]||0) + comps[parseInt(idx)];
    }
    return r;
  }, [compAssign, activeStations, comps]);

  // Capacity validation for each compartment assignment
  function getCapacityStatus(idx, val) {
    if (!val) return null;
    const { station:st, set:sn, fuel } = val;
    const rec = isJuta(st) ? recOrders[st]?.[sn]?.[fuel] : recOrders[st]?.[fuel];
    if (!rec) return null;
    const assignedSoFar = Object.entries(compAssign)
      .filter(([i, v]) => i!==String(idx) && v?.station===st && v?.set===sn && v?.fuel===fuel)
      .reduce((sum,[i]) => sum + comps[parseInt(i)], 0);
    const thisVol = comps[parseInt(idx)];
    const total   = assignedSoFar + thisVol;
    return { total, space: rec.space, ok: total <= rec.space };
  }

  const totalAllocated = Object.entries(compAssign).reduce((s,[idx,v]) => v?s+comps[parseInt(idx)]:s, 0);

  if (!group) return <div>Sin grupos configurados.</div>;

  return (
    <div>
      {/* Group tabs */}
      <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
        {orderGroups.map((g,i) => (
          <button key={g.id} onClick={()=>setGroupIdx(i)} style={{ ...S.btn, background:groupIdx===i?'#1e3a5f':'white', color:groupIdx===i?'white':'#64748b', border:`2px solid ${groupIdx===i?'#1e3a5f':'#e2e8f0'}`, padding:'10px 22px', fontSize:15 }}>{g.name}</button>
        ))}
      </div>
      <div style={{ fontSize:13, color:'#64748b', marginBottom:16 }}>{group.desc}</div>

      {/* Order config */}
      <div style={{ ...S.card }} className="no-print">
        <div style={S.title}>⚙️ Parámetros</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }} className="g2">
          <div>
            <label style={S.label}>Cisterna a utilizar</label>
            <select style={S.input} value={selCist} onChange={e=>setSelCist(e.target.value)}>
              {group.cisternas.map(c => {
                const isNext = nextCisterna?.[group.stations[0]] === c;
                return <option key={c} value={c}>Cisterna {c}{isNext?' ★':''} — {(cisternas[c]||[]).reduce((a,b)=>a+b,0).toLocaleString()} gal ({(cisternas[c]||[]).length} comp.)</option>;
              })}
            </select>
            {nextCisterna?.[group.stations[0]] && group.cisternas.includes(nextCisterna[group.stations[0]]) && (
              <div style={{ fontSize:11, color:'#059669', marginTop:4 }}>★ Cisterna marcada como disponible en el Registro Diario</div>
            )}
          </div>
          <div>
            <label style={S.label}>Gasolineras en este pedido</label>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginTop:6 }}>
              {group.stations.map(s => (
                <button key={s} onClick={()=>toggleStation(s)} style={{ ...S.btn, background:activeStations.includes(s)?STATION_COLORS[s]:'white', color:activeStations.includes(s)?'white':'#64748b', border:`2px solid ${activeStations.includes(s)?STATION_COLORS[s]:'#e2e8f0'}`, padding:'7px 14px', fontSize:13, borderRadius:20 }}>{s}</button>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Recommended orders */}
      <div style={S.card}>
        <div style={S.title}>📋 Pedido Recomendado</div>
        <div style={S.alert('info')}>🎯 Objetivo: llenar al {config.idealPct||90}% al llegar la cisterna (Día 3 mañana). El nivel al llegar = nivel mañana − ventas Día 1 − ventas Día 2.</div>
        {activeStations.map(station => {
          const isJ  = isJuta(station);
          const isSO = isSupplyOnly(station);
          return (
            <div key={station} style={{ marginBottom:20, paddingBottom:20, borderBottom:'1px solid #f1f5f9' }}>
              <div style={{ fontWeight:700, color:STATION_COLORS[station], fontSize:15, marginBottom:12 }}>
                📍 {station}{isSO && <span style={{ fontWeight:400, fontSize:12, color:'#64748b', marginLeft:8 }}>(suministro externo — cantidad solicitada)</span>}
              </div>
              {isJ ? (
                Object.entries(JUTA_SETS).map(([sn, fuels]) => (
                  <div key={sn} style={{ marginBottom:12, padding:14, background:'#f8fafc', borderRadius:10, borderLeft:`4px solid ${SET_COLORS[sn]}` }}>
                    <div style={{ fontWeight:700, color:SET_COLORS[sn], marginBottom:10 }}>🛢️ {sn}</div>
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10 }} className="g3">
                      {fuels.map(fuel => {
                        const r = recOrders[station]?.[sn]?.[fuel];
                        if (!r) return null;
                        const col    = FUEL_COLORS[fuel];
                        const urgent = r.atDel < r.min && r.max > 0;
                        return (
                          <div key={fuel} style={{ padding:12, background:'white', borderRadius:8, borderLeft:`3px solid ${col}` }}>
                            <div style={{ fontWeight:600, color:col, marginBottom:6 }}>{FUEL_ICONS[fuel]} {fuel}</div>
                            <div style={{ fontSize:12, color:'#64748b' }}>Al llegar: <strong style={{ color:urgent?'#dc2626':'#1e293b' }}>{fmt(r.atDel)} gal ({pct(r.atDel,r.max)}%)</strong>{urgent&&' 🚨'}</div>
                            <div style={{ fontSize:12, color:'#64748b' }}>Espacio: <strong style={{ color:'#059669' }}>{fmt(r.space)} gal</strong></div>
                            <div style={{ marginTop:6, paddingTop:6, borderTop:'1px solid #f1f5f9' }}>
                              <div style={{ fontSize:11, color:'#94a3b8', marginBottom:2 }}>Rango de pedido</div>
                              <div style={{ fontSize:15, fontWeight:700, color:col }}>{fmtG(r.orderMin)} — {fmtG(r.orderMax)}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))
              ) : (
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }} className="g3">
                  {FUELS.map(fuel => {
                    const r = recOrders[station]?.[fuel];
                    if (!r) return null;
                    const col = FUEL_COLORS[fuel];
                    const urgent = !isSO && r.atDel < r.min && r.max > 0;
                    return (
                      <div key={fuel} style={{ padding:12, background:'#f8fafc', borderRadius:8, borderLeft:`3px solid ${col}` }}>
                        <div style={{ fontWeight:600, color:col, marginBottom:6 }}>{FUEL_ICONS[fuel]} {fuel}</div>
                        {isSO ? (
                          <div style={{ fontSize:14, fontWeight:700, color:col, marginTop:4 }}>
                            Solicitado: {fmtG(r.order)}
                          </div>
                        ) : (
                          <>
                            <div style={{ fontSize:12, color:'#64748b' }}>Al llegar: <strong style={{ color:urgent?'#dc2626':'#1e293b' }}>{fmt(r.atDel)} gal ({pct(r.atDel,r.max)}%)</strong>{urgent&&' 🚨'}</div>
                            <div style={{ fontSize:12, color:'#64748b' }}>Espacio: <strong style={{ color:'#059669' }}>{fmt(r.space)} gal</strong></div>
                            <div style={{ marginTop:6, paddingTop:6, borderTop:'1px solid #f1f5f9' }}>
                              <div style={{ fontSize:11, color:'#94a3b8', marginBottom:2 }}>Rango de pedido</div>
                              <div style={{ fontSize:15, fontWeight:700, color:col }}>{fmtG(r.orderMin)} — {fmtG(r.orderMax)}</div>
                            </div>
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        <div style={{ background:'#f1f5f9', borderRadius:10, padding:14 }}>
          <strong>Total combinado: {fmtG(totalRec)}</strong>
          {totalRec > totalCist
            ? <span style={{ color:'#dc2626', fontWeight:700, marginLeft:8 }}>⚠️ Excede cisterna ({fmtG(totalCist)}) por {fmtG(totalRec-totalCist)}</span>
            : <span style={{ color:'#059669', marginLeft:8 }}>✅ Cabe en la cisterna ({fmtG(totalCist-totalRec)} libre)</span>}
        </div>
      </div>

      {/* Compartment allocator */}
      <div style={S.card}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <div style={S.title}>🔧 Asignación de Compartimentos — Cisterna {selCist}</div>
          <button style={{ ...S.btn, background:'#1e3a5f', color:'white' }} onClick={runOptimize} className="no-print">✨ Auto-Optimizar</button>
        </div>
        {optimized && <div style={S.alert('ok')}>✅ Asignación optimizada. Ajusta manualmente si necesitas.</div>}

        {/* Visual bar */}
        <div style={{ display:'flex', gap:4, height:60, marginBottom:16 }}>
          {comps.map((vol, i) => {
            const a = compAssign[i];
            const bg = !a ? '#cbd5e1' : FUEL_COLORS[a.fuel] || '#94a3b8';
            const stCol = a ? STATION_COLORS[a.station] : null;
            return (
              <div key={i} style={{ flex:vol, background:bg, borderRadius:7, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', color:'white', fontSize:11, fontWeight:700, border:stCol?`3px solid ${stCol}`:'3px solid transparent', minWidth:34 }}
                title={`C${i+1}: ${vol.toLocaleString()} gal${a?` → ${a.station}${a.set?' '+a.set:''} (${a.fuel})`:' (sin asignar)'}`}>
                <div>C{i+1}</div>
                <div style={{ fontSize:10 }}>{vol>=1000?`${vol/1000}k`:vol}</div>
                {a && <div style={{ fontSize:9, opacity:0.85 }}>{a.fuel?.slice(0,3)}{a.set?' S'+(a.set==='Set 1'?'1':'2'):''}</div>}
              </div>
            );
          })}
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', fontSize:13, color:'#64748b', marginBottom:14 }}>
          <span>Asignados: <strong>{fmtG(totalAllocated)}</strong> / {fmtG(totalCist)}</span>
          <span style={{ color:totalAllocated===totalCist?'#059669':'#64748b', fontWeight:600 }}>
            {totalAllocated===totalCist?'✅ 100% asignado':`Libre: ${fmtG(totalCist-totalAllocated)}`}
          </span>
        </div>

        {/* Detail rows */}
        {comps.map((vol, i) => {
          const a   = compAssign[i];
          const cap = getCapacityStatus(i, a);
          const st  = a?.station || '';
          const sn  = a?.set || '';
          const isJ = st && isJuta(st);
          const availFuels = isJ && sn ? JUTA_SETS[sn] || FUELS : FUELS;

          return (
            <div key={i} style={{ display:'grid', gridTemplateColumns:'130px 1fr 1fr 1fr auto', gap:8, alignItems:'center', padding:'10px 0', borderBottom:'1px solid #f8fafc' }}>
              <div style={{ fontWeight:600, fontSize:13 }}>C{i+1} <span style={{ color:'#94a3b8', fontWeight:400, fontSize:12 }}>({vol.toLocaleString()} gal)</span></div>
              <select style={S.inputSm} value={st} onChange={e=>{const ns=e.target.value; assignComp(i,ns,isJuta(ns)?'Set 1':'',a?.fuel||'');}}>
                <option value="">— Gasolinera —</option>
                {activeStations.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
              {isJ ? (
                <select style={{ ...S.inputSm, borderColor:'#7c3aed' }} value={sn} onChange={e=>assignComp(i,st,e.target.value,a?.fuel||'')}>
                  <option value="">— Set —</option>
                  {Object.keys(JUTA_SETS).map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              ) : (
                <div style={{ fontSize:12, color:'#94a3b8', textAlign:'center' }}>—</div>
              )}
              <select style={S.inputSm} value={a?.fuel||''} onChange={e=>assignComp(i,st,sn,e.target.value)}>
                <option value="">— Combustible —</option>
                {availFuels.map(f=><option key={f} value={f}>{FUEL_ICONS[f]} {f}</option>)}
              </select>
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                {cap && <span style={{ fontSize:11, color:cap.ok?'#059669':'#dc2626', fontWeight:700 }} title={`${fmt(cap.total)} / ${fmt(cap.space)} gal`}>{cap.ok?'✅':'⚠️'}</span>}
                <button onClick={()=>clearComp(i)} style={{ ...S.btn, background:'#f1f5f9', color:'#64748b', padding:'5px 10px', fontSize:12, border:'1px solid #e2e8f0' }}>✕</button>
              </div>
            </div>
          );
        })}
      </div>

      {/* Final Summary */}
      {totalAllocated > 0 && (
        <div style={S.card}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
            <div style={S.title}>📦 Resumen Final del Pedido</div>
            <button style={{ ...S.btn, background:'#f1f5f9', color:'#475569', fontSize:13, border:'1px solid #e2e8f0', padding:'7px 14px' }} onClick={()=>window.print()} className="no-print">🖨️ Imprimir</button>
          </div>
          {activeStations.map(st => {
            const isJ  = isJuta(st);
            const isSO = isSupplyOnly(st);
            const stTotal = isJ
              ? Object.values(actualOrder[st]||{}).reduce((t,fs)=>t+Object.values(fs).reduce((a,b)=>a+b,0),0)
              : FUELS.reduce((t,f)=>t+(actualOrder[st]?.[f]||0),0);
            if (!stTotal) return null;
            return (
              <div key={st} style={{ marginBottom:20 }}>
                <div style={{ fontWeight:700, color:STATION_COLORS[st], fontSize:15, marginBottom:10 }}>📍 {st} — Total: {fmtG(stTotal)}</div>
                {isJ ? (
                  Object.entries(JUTA_SETS).map(([sn,fuels]) => (
                    <div key={sn} style={{ marginBottom:10 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:SET_COLORS[sn], marginBottom:6 }}>🛢️ {sn}</div>
                      <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
                        {fuels.map(fuel => {
                          const ordered  = actualOrder[st]?.[sn]?.[fuel]||0;
                          const recMin   = recOrders[st]?.[sn]?.[fuel]?.orderMin||0;
                          const recMax   = recOrders[st]?.[sn]?.[fuel]?.orderMax||0;
                          const inRange  = ordered>=recMin && ordered<=recMax;
                          const col      = FUEL_COLORS[fuel];
                          return (
                            <div key={fuel} style={{ padding:12, background:'#f8fafc', borderRadius:8, borderLeft:`3px solid ${col}`, minWidth:140 }}>
                              <div style={{ fontWeight:600, color:col }}>{FUEL_ICONS[fuel]} {fuel}</div>
                              <div style={{ fontSize:18, fontWeight:700, marginTop:6 }}>{fmtG(ordered)}</div>
                              <div style={{ fontSize:11, color:'#64748b' }}>
                                Rango: {fmtG(recMin)}–{fmtG(recMax)}
                                <span style={{ marginLeft:6, fontWeight:700, color:inRange?'#059669':ordered<recMin?'#dc2626':'#d97706' }}>
                                  {inRange?'✅ En rango':ordered<recMin?'⚠️ Bajo mín':'⚠️ Sobre máx'}
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))
                ) : (
                  <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
                    {FUELS.map(fuel => {
                      const ordered  = actualOrder[st]?.[fuel]||0;
                      const recEntry = recOrders[st]?.[fuel];
                      const recMin   = recEntry?.orderMin||0;
                      const recMax   = recEntry?.orderMax||0;
                      const col      = FUEL_COLORS[fuel];
                      const inRange  = ordered>=recMin && ordered<=recMax;
                      return (
                        <div key={fuel} style={{ padding:12, background:'#f8fafc', borderRadius:8, borderLeft:`3px solid ${col}`, minWidth:140 }}>
                          <div style={{ fontWeight:600, color:col }}>{FUEL_ICONS[fuel]} {fuel}</div>
                          <div style={{ fontSize:18, fontWeight:700, marginTop:6 }}>{fmtG(ordered)}</div>
                          {isSO ? (
                            <div style={{ fontSize:11, color:'#64748b' }}>Solicitado: {fmtG(recMin)}</div>
                          ) : (
                            <div style={{ fontSize:11, color:'#64748b' }}>
                              Rango: {fmtG(recMin)}–{fmtG(recMax)}
                              <span style={{ marginLeft:6, fontWeight:700, color:inRange?'#059669':ordered<recMin?'#dc2626':'#d97706' }}>
                                {inRange?'✅':ordered<recMin?'⚠️ Bajo':'⚠️ Sobre'}
                              </span>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          <div style={{ background:'linear-gradient(135deg,#1e3a5f,#2d6296)', color:'white', borderRadius:12, padding:20, marginTop:8 }}>
            <div style={{ fontWeight:700, fontSize:18, marginBottom:14 }}>✅ Pedido Total — Cisterna {selCist}</div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16 }}>
              {[['Total pedido',fmtG(totalAllocated)],['Cap. cisterna',fmtG(totalCist)],['Sin asignar',fmtG(totalCist-totalAllocated)]].map(([l,v],i)=>(
                <div key={i}><div style={{ fontSize:11, opacity:0.7, textTransform:'uppercase' }}>{l}</div><div style={{ fontWeight:700, fontSize:16, marginTop:4, color:i===2&&totalCist-totalAllocated>0?'#fbbf24':'white' }}>{v}</div></div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// HISTORY TAB — view and navigate past log entries
// ═══════════════════════════════════════════════════════════
function HistoryTab({ config, dailyLog }) {
  const [st,  setSt]  = useState('Puma Juticalpa');
  const [days, setDays] = useState(14);

  const today = getTodayStr();
  const dates = Array.from({ length:days }, (_,i) => addDays(today, -(days-1-i)));

  const invKeys = isJuta(st)
    ? Object.entries(JUTA_SETS).flatMap(([sn,fuels])=>fuels.map(f=>({set:sn,fuel:f})))
    : FUELS.map(f=>({set:null,fuel:f}));

  return (
    <div>
      <div style={S.stBar}>
        {STATIONS.map(s => <button key={s} style={S.stBtn(st===s,STATION_COLORS[s])} onClick={()=>setSt(s)}>{s}</button>)}
      </div>
      <div style={{ display:'flex', gap:10, alignItems:'center', marginBottom:16 }}>
        <label style={{ ...S.label, marginBottom:0, whiteSpace:'nowrap' }}>Mostrar días:</label>
        {[7,14,30].map(d=><button key={d} onClick={()=>setDays(d)} style={{ ...S.btn, background:days===d?'#1e3a5f':'white', color:days===d?'white':'#64748b', border:`1px solid ${days===d?'#1e3a5f':'#e2e8f0'}`, padding:'6px 14px', fontSize:13 }}>{d} días</button>)}
      </div>
      <div style={S.card}>
        <div style={S.title}>📅 Historial — {st}</div>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', minWidth:600 }}>
            <thead>
              <tr>
                <th style={{ ...S.th, textAlign:'left', minWidth:90 }}>Fecha</th>
                {invKeys.map(({ set:sn, fuel }) => (
                  <th key={(sn||'')+fuel} style={S.th}>
                    {sn && <span style={{ display:'block', fontSize:10, color:SET_COLORS[sn] }}>{sn}</span>}
                    <span style={{ color:FUEL_COLORS[fuel] }}>{FUEL_ICONS[fuel]} {fuel}</span>
                  </th>
                ))}
                <th style={S.th}>Venta Total</th>
                <th style={S.th}>Notas</th>
              </tr>
            </thead>
            <tbody>
              {dates.map(date => {
                const entry = dailyLog[st]?.[date];
                const sales = invKeys.map(({set:sn,fuel}) => getSale(dailyLog,st,date,fuel,sn));
                const totalSale = sales.reduce((t,s)=>t+(s??0),0);
                return (
                  <tr key={date} className="row-hover">
                    <td style={{ ...S.td, textAlign:'left', fontWeight:600 }}>
                      <div>{dayLabel(date)}</div>
                      {entry && <div style={{ fontSize:10, color:'#059669' }}>✅ Datos</div>}
                      {!entry && <div style={{ fontSize:10, color:'#94a3b8' }}>Sin registro</div>}
                    </td>
                    {invKeys.map(({set:sn,fuel},j) => {
                      const m = getMorning(dailyLog,st,date,fuel,sn);
                      const max = getMaxCap(config,st,fuel,sn);
                      const sale = sales[j];
                      return (
                        <td key={(sn||'')+fuel} style={S.td}>
                          {m!==null ? (
                            <>
                              <div style={{ fontWeight:600 }}>{fmt(m)} <span style={{ fontSize:10, color:'#94a3b8' }}>({pct(m,max)}%)</span></div>
                              {sale!==null&&<div style={{ fontSize:11, color:'#059669' }}>↓ {fmt(sale)}</div>}
                            </>
                          ) : <span style={{ color:'#cbd5e1' }}>—</span>}
                        </td>
                      );
                    })}
                    <td style={{ ...S.td, fontWeight:600, color:'#1e3a5f' }}>{totalSale>0?fmtG(totalSale):'—'}</td>
                    <td style={{ ...S.td, fontSize:12, color:'#64748b', textAlign:'left', maxWidth:160 }}>{entry?.notes||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ROOT APP
// ═══════════════════════════════════════════════════════════
function App() {
  // undefined = still checking, null = logged out, object = logged in
  const [currentUser, setCurrentUser] = useState(undefined);
  const [appReady,    setAppReady]    = useState(false);
  const [cloudStatus, setCloudStatus] = useState(IS_CLOUD ? 'connecting' : 'local');
  const [tab,         setTab]         = useState('log');
  const [config,      setConfig]      = useState(defaultConfig());
  const [dailyLog,    setDailyLog]    = useState({});
  const [cisternas,   setCisternas]   = useState(DEFAULT_CISTERNAS);
  const [orderGroups]                 = useState(DEFAULT_ORDER_GROUPS);
  const [nextCisterna, setNextCisterna] = useState({});

  const fromCloudRef = React.useRef(false);
  const saveTimerRef = React.useRef(null);

  // ── Step 1: Watch auth state ──
  useEffect(() => {
    const unsub = onAuthChange(user => setCurrentUser(user));
    return unsub;
  }, []);

  // ── Step 2: Load data once we know who's logged in ──
  useEffect(() => {
    if (currentUser === undefined) return; // still resolving auth
    if (IS_CLOUD && !currentUser) {
      setAppReady(true); // show login screen
      return;
    }
    setAppReady(false);
    setCloudStatus(IS_CLOUD ? 'connecting' : 'local');
    loadStateAsync().then(saved => {
      if (saved) {
        if (saved.config)       setConfig(saved.config);
        if (saved.dailyLog)     setDailyLog(saved.dailyLog);
        if (saved.cisternas)    setCisternas(saved.cisternas);
        if (saved.nextCisterna) setNextCisterna(saved.nextCisterna);
      }
      setAppReady(true);
      if (IS_CLOUD) setCloudStatus('synced');
    }).catch(() => { setAppReady(true); setCloudStatus('error'); });
  }, [currentUser]);

  // ── Step 3: Real-time sync listener (only when authenticated + app ready) ──
  useEffect(() => {
    if (!appReady || !currentUser) return;
    const unsub = subscribeToCloud(data => {
      fromCloudRef.current = true;
      if (data.config)       setConfig(data.config);
      if (data.dailyLog)     setDailyLog(data.dailyLog);
      if (data.cisternas)    setCisternas(data.cisternas);
      if (data.nextCisterna) setNextCisterna(data.nextCisterna);
      setCloudStatus('synced');
      requestAnimationFrame(() => { fromCloudRef.current = false; });
    });
    return unsub;
  }, [appReady, currentUser]);

  // ── Step 4: Save on changes (debounced in cloud mode) ──
  useEffect(() => {
    if (!appReady || !currentUser) return;
    if (fromCloudRef.current) return;
    const payload = { config, dailyLog, cisternas, orderGroups, nextCisterna };
    if (IS_CLOUD) {
      setCloudStatus('saving');
      clearTimeout(saveTimerRef.current);
      saveTimerRef.current = setTimeout(() => {
        saveStateAsync(payload)
          .then(() => setCloudStatus('synced'))
          .catch(() => setCloudStatus('error'));
      }, 1200);
    } else {
      saveStateAsync(payload);
    }
  }, [config, dailyLog, cisternas, nextCisterna, appReady, currentUser]);

  function exportData() {
    const blob = new Blob([JSON.stringify({ config, dailyLog, cisternas, orderGroups, nextCisterna }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gasolineras_backup_${getTodayStr()}.json`;
    a.click();
  }
  function importData(e) {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.config)        setConfig(d.config);
        if (d.dailyLog)      setDailyLog(d.dailyLog);
        if (d.cisternas)     setCisternas(d.cisternas);
        if (d.nextCisterna)  setNextCisterna(d.nextCisterna);
        alert('✅ Datos importados.');
      } catch(err) { alert('❌ Error: '+err.message); }
    };
    r.readAsText(file); e.target.value = '';
  }

  const TABS = [
    { id:'log',      label:'📋 Registro Diario' },
    { id:'forecast', label:'📈 Pronóstico 3 Días' },
    { id:'order',    label:'🚛 Planear Pedido' },
    { id:'history',  label:'📅 Historial' },
    { id:'config',   label:'⚙️ Configuración' },
  ];

  // Waiting for auth check
  if (currentUser === undefined) {
    return (
      <div style={{ minHeight:'100vh', background:'linear-gradient(135deg,#1e3a5f,#2d6296)', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16, color:'white', fontFamily:"-apple-system,sans-serif" }}>
        <div style={{ fontSize:48 }}>⛽</div>
        <div style={{ fontWeight:700, fontSize:20 }}>Gestor de Pedidos</div>
        <div style={{ fontSize:14, opacity:0.7 }}>Verificando acceso…</div>
      </div>
    );
  }

  // Not logged in (cloud mode) → show login screen
  if (IS_CLOUD && !currentUser) return <LoginScreen />;

  // Loading data after login
  if (!appReady) {
    return (
      <div style={{ minHeight:'100vh', background:'linear-gradient(135deg,#1e3a5f,#2d6296)', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16, color:'white', fontFamily:"-apple-system,sans-serif" }}>
        <div style={{ fontSize:48 }}>⛽</div>
        <div style={{ fontWeight:700, fontSize:20 }}>Gestor de Pedidos</div>
        <div style={{ fontSize:14, opacity:0.7 }}>Cargando datos…</div>
      </div>
    );
  }

  // Cloud status badge config
  const statusMap = {
    local:      { color:'#94a3b8', bg:'rgba(255,255,255,0.10)', icon:'💾', text:'Local' },
    connecting: { color:'#fbbf24', bg:'rgba(251,191,36,0.15)',  icon:'🔄', text:'Conectando…' },
    saving:     { color:'#60a5fa', bg:'rgba(96,165,250,0.15)',  icon:'🔄', text:'Guardando…' },
    synced:     { color:'#34d399', bg:'rgba(52,211,153,0.15)',  icon:'☁️', text:'Sincronizado' },
    error:      { color:'#f87171', bg:'rgba(248,113,113,0.15)', icon:'⚠️', text:'Error de conexión' },
  };
  const st_badge = statusMap[cloudStatus] || statusMap.local;

  return (
    <div style={{ minHeight:'100vh', background:'#f1f5f9', fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif", color:'#1e293b' }}>
      <div style={{ background:'linear-gradient(135deg,#1e3a5f,#2d6296)', color:'white', padding:'14px 24px', display:'flex', alignItems:'center', gap:14, boxShadow:'0 2px 12px rgba(0,0,0,0.2)' }} className="no-print">
        <div style={{ fontSize:28 }}>⛽</div>
        <div style={{ flex:1 }}>
          <div style={{ fontWeight:700, fontSize:18, lineHeight:1.2 }}>Gestor de Pedidos — Gasolineras</div>
          <div style={{ fontSize:12, opacity:0.75 }}>Puma Juticalpa · Limones · Las Delicias · La Granja · Puma Paz</div>
        </div>
        {/* Cloud sync status */}
        <div style={{ padding:'5px 12px', borderRadius:20, background:st_badge.bg, border:`1px solid ${st_badge.color}40`, fontSize:12, fontWeight:600, color:st_badge.color, whiteSpace:'nowrap' }}>
          {st_badge.icon} {st_badge.text}
        </div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          {/* Logged-in user */}
          {IS_CLOUD && currentUser?.email && (
            <div style={{ fontSize:12, opacity:0.7, whiteSpace:'nowrap', maxWidth:160, overflow:'hidden', textOverflow:'ellipsis' }}>
              👤 {currentUser.email}
            </div>
          )}
          <button onClick={exportData} style={{ ...S.btn, background:'rgba(255,255,255,0.15)', color:'white', fontSize:12, padding:'7px 13px', border:'1px solid rgba(255,255,255,0.3)' }}>📥 Exportar</button>
          <label style={{ ...S.btn, background:'rgba(255,255,255,0.15)', color:'white', fontSize:12, padding:'7px 13px', border:'1px solid rgba(255,255,255,0.3)', cursor:'pointer' }}>
            📤 Importar<input type="file" accept=".json" style={{ display:'none' }} onChange={importData} />
          </label>
          {IS_CLOUD && currentUser && (
            <button onClick={()=>signOut()} style={{ ...S.btn, background:'rgba(255,255,255,0.10)', color:'rgba(255,255,255,0.8)', fontSize:12, padding:'7px 13px', border:'1px solid rgba(255,255,255,0.2)' }}>
              Salir
            </button>
          )}
        </div>
      </div>
      <div style={{ background:'white', borderBottom:'1px solid #e2e8f0', display:'flex', padding:'0 20px', overflowX:'auto' }} className="no-print">
        {TABS.map(t => (
          <div key={t.id} onClick={()=>setTab(t.id)} style={{ padding:'13px 16px', cursor:'pointer', fontSize:14, fontWeight:500, whiteSpace:'nowrap', color:tab===t.id?'#1e3a5f':'#64748b', borderBottom:`3px solid ${tab===t.id?'#1e3a5f':'transparent'}`, transition:'all 0.15s', userSelect:'none' }}>
            {t.label}
          </div>
        ))}
      </div>
      <div style={{ padding:20, maxWidth:1200, margin:'0 auto' }}>
        {tab==='config'   && <ConfigTab    config={config} setConfig={setConfig} cisternas={cisternas} setCisternas={setCisternas} />}
        {tab==='log'      && <DailyLogTab  config={config} dailyLog={dailyLog} setDailyLog={setDailyLog} cisternas={cisternas} nextCisterna={nextCisterna} setNextCisterna={setNextCisterna} />}
        {tab==='forecast' && <ForecastTab  config={config} dailyLog={dailyLog} />}
        {tab==='order'    && <OrderTab     config={config} dailyLog={dailyLog} cisternas={cisternas} orderGroups={orderGroups} nextCisterna={nextCisterna} />}
        {tab==='history'  && <HistoryTab   config={config} dailyLog={dailyLog} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
